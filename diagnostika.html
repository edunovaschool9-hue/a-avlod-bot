<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diagnostika Markazi | EDUNOVA</title>
<meta name="description" content="EduNova Diagnostika Markazi — bolaning yashirin iqtidorini ochamiz. Bepul onlayn diagnostika.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Archivo+Black&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== EDUNOVA ZAVOD THEME — diagnostika (yagona dizayn) ===== */
:root{
  --bg:#E7E1D3; --s:#F6F1E6; --s2:#EFE9DC; --s3:#E2DBCC;
  --brd:#CFC7B6; --brd2:#BDB4A0;
  --tx:#1C1C1C; --mu:#8B8577; --mu2:#5C574B;
  --ac:#FF6B1A; --ac2:#FF8A47; --acd:#E85400;
  --cy:#E85400; --gn:#2FA872; --rd:#D14B4B; --go:#C98A1B; --bl:#3A3A3A;
  --r:18px; --rs:12px;
  --ff:'DM Sans',-apple-system,sans-serif; --fd:'Space Grotesk',sans-serif; --fm:'DM Sans',monospace;
  --glow:0 0 34px rgba(255,107,26,.30);
  --glass:rgba(255,255,255,.6); --glass-brd:#CFC7B6; --glass-hi:rgba(255,255,255,.9);
  --shadow-sm:0 2px 10px rgba(28,28,28,.08);
  --shadow:0 12px 34px rgba(28,28,28,.12);
  --shadow-lg:0 24px 60px rgba(28,28,28,.18);
  --grad-ac:linear-gradient(135deg,#FF6B1A,#FF8A47);
  --grad-cy:linear-gradient(135deg,#E85400,#FF6B1A);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--ff);color:var(--tx);min-height:100vh;line-height:1.5;overflow-x:hidden;
  background:
    repeating-linear-gradient(90deg,transparent 0 119px,rgba(28,28,28,.03) 119px 120px),
    repeating-linear-gradient(0deg,transparent 0 119px,rgba(28,28,28,.03) 119px 120px),
    var(--bg)}
button{cursor:pointer;font-family:var(--ff)}
input,select,textarea{font-family:var(--ff)}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--ac) 0 16px,#1C1C1C 16px 32px)}
.dg-top{display:flex;justify-content:space-between;align-items:center;padding:14px 5%;background:rgba(231,225,211,.92);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--brd);position:sticky;top:0;z-index:40}
.dg-logo b{font-family:'Archivo Black',sans-serif;font-size:20px;color:#1C1C1C;letter-spacing:.5px}
.dg-logo b span{color:var(--ac)}
.dg-logo small{display:block;font-family:'Oswald',sans-serif;font-weight:500;font-size:9px;letter-spacing:3px;color:var(--mu)}
.dg-back{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#1C1C1C;border:2px solid #1C1C1C;background:transparent;padding:9px 18px;text-decoration:none;transition:.15s}
.dg-back:hover{background:#1C1C1C;color:#fff}
.dg-wrap{max-width:860px;margin:0 auto;padding:26px 16px 80px}
/* ═══ DIAGNOSTIKA TEST ═══ */
.diag-card:hover{border-color:var(--ac)!important;transform:translateY(-3px)}
.diag-soon{cursor:not-allowed}
.dt-wrap{max-width:600px;margin:0 auto}
.dt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dt-back{background:var(--s2);border:1px solid var(--brd);color:var(--mu2);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600}
.dt-back:hover{border-color:var(--ac)}
.dt-prog{flex:1;margin:0 16px;height:8px;background:var(--s2);border-radius:6px;overflow:hidden}
.dt-prog-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--cy));border-radius:6px;transition:width .4s}
.dt-q{background:var(--s);border:1px solid var(--brd);border-radius:20px;padding:32px 26px;text-align:center}
.dt-skill-badge{display:inline-block;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:18px}
.dt-q-text{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--tx);line-height:1.3;margin-bottom:8px}
.dt-q-hint{font-size:14px;color:var(--mu);margin-bottom:24px}
.dt-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dt-opt{background:var(--s2);border:2px solid var(--brd);border-radius:16px;padding:22px 14px;cursor:pointer;transition:.2s;font-family:var(--fd);font-size:16px;font-weight:600;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:10px}
.dt-opt:hover{border-color:var(--ac);transform:scale(1.03)}
.dt-opt:active{transform:scale(.97)}
.dt-opt-emoji{font-size:42px}
.dt-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.dt-img-cell{aspect-ratio:1;background:var(--s2);border:2px solid var(--brd);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:44px;transition:.3s}
.dt-img-cell.hidden-card{background:var(--ac);color:transparent}
.dt-speaker{background:var(--s2);border:1px solid var(--brd);border-radius:50%;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;margin-bottom:14px}
.dt-speaker:active{transform:scale(.9)}
/* result screens */
.dt-result-kid{text-align:center;padding:30px 20px}
.dt-stars{font-size:50px;margin:14px 0;letter-spacing:6px}
.dt-powers{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}
.dt-power-row{display:flex;align-items:center;gap:12px}
.dt-power-ic{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.dt-power-name{font-size:14px;font-weight:600;color:var(--tx);width:90px;flex-shrink:0}
.dt-power-bar{flex:1;height:14px;background:var(--s2);border-radius:8px;overflow:hidden}
.dt-power-fill{height:100%;border-radius:8px;transition:width 1s}
.dt-power-pct{font-family:var(--fm);font-size:13px;color:var(--ac2);width:42px;text-align:right;flex-shrink:0}
.dt-rec{background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(232,84,0,.08));border:1px solid rgba(52,211,153,.3);border-radius:16px;padding:22px;margin-top:20px;text-align:center}

/* professions block (job market) */
.dc-professions{background:var(--s);border:1px solid var(--brd);border-radius:16px;padding:20px;margin-top:14px}
.dc-prof-head{margin-bottom:14px}
.dc-prof-title{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--tx)}
.dc-prof-sub{font-size:12px;color:var(--mu2);margin-top:2px}
.dc-prof-list{display:flex;flex-direction:column;gap:8px}
.dc-prof-row{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:10px;padding:12px 14px}
.dc-prof-name{font-size:13.5px;font-weight:600;color:var(--tx)}
.dc-prof-demand{font-size:18px;flex-shrink:0;margin-left:10px}
.dc-prof-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--brd)}
.dc-prof-leg-item{font-size:11px;color:var(--mu);white-space:nowrap}

/* ═══ DIAGNOSTIKA MARKAZI (center model) ═══ */
.dc-screen{max-width:600px;margin:0 auto}
.dc-center{text-align:center;padding:30px 20px}
.dc-logo-ic{font-size:60px;margin-bottom:16px}
.dc-title{font-family:var(--fd);font-size:26px;font-weight:800;color:var(--tx);margin-bottom:6px}
.dc-sub{font-size:14px;color:var(--mu2);margin-bottom:26px;line-height:1.5}
/* language picker */
.dc-langs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.dc-lang{background:var(--s);border:2px solid var(--brd);border-radius:18px;padding:24px 36px;cursor:pointer;transition:.2s;font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:140px}
.dc-lang:hover{border-color:var(--ac);transform:translateY(-4px)}
.dc-lang-flag{font-size:42px}
/* registration form */
.dc-field{margin-bottom:18px;text-align:left}
.dc-field label{display:block;font-size:13px;color:var(--mu2);margin-bottom:8px;font-weight:600}
.dc-input{width:100%;padding:16px 18px;background:var(--s2);border:1px solid var(--brd);border-radius:12px;color:var(--tx);font-size:16px;outline:none;transition:.2s}
.dc-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,107,26,.15)}
.dc-age-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dc-class-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.dc-class{background:var(--s2);border:2px solid var(--brd);border-radius:10px;padding:12px 0;text-align:center;cursor:pointer;font-family:var(--fd);font-size:17px;font-weight:700;color:var(--tx);transition:.15s}
.dc-class:hover{border-color:var(--ac)}
.dc-class.sel{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.05)}
@media(max-width:520px){.dc-class-grid{grid-template-columns:repeat(4,1fr)}}
.dc-age{background:var(--s2);border:2px solid var(--brd);border-radius:12px;padding:14px 0;text-align:center;cursor:pointer;font-family:var(--fd);font-size:18px;font-weight:700;color:var(--tx);transition:.15s}
.dc-age:hover{border-color:var(--ac)}
.dc-age.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.dc-btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:var(--fd);font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--cy));box-shadow:0 8px 24px rgba(255,107,26,.35);transition:.2s;margin-top:6px}
.dc-btn:active{transform:scale(.97)}
.dc-btn:disabled{opacity:.4;cursor:not-allowed}
/* patient card */
.dc-patient{background:linear-gradient(135deg,rgba(255,107,26,.12),rgba(232,84,0,.07));border:1px solid rgba(255,107,26,.3);border-radius:16px;padding:18px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.dc-patient-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--acd));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
/* cabinet intro */
.dc-intro{text-align:center;padding:50px 24px;animation:dcIntroIn .5s ease-out}
@keyframes dcIntroIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.dc-intro-num{font-family:var(--fm);font-size:14px;letter-spacing:3px;color:var(--ac2);text-transform:uppercase;margin-bottom:14px}
.dc-doc{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 8px 30px rgba(255,107,26,.3)}
.dc-intro-room{font-family:var(--fd);font-size:28px;font-weight:800;color:var(--tx);margin-bottom:6px}
.dc-intro-spec{font-size:15px;color:var(--ac2);font-weight:600;margin-bottom:12px}
.dc-intro-desc{font-size:14px;color:var(--mu2);line-height:1.6;max-width:380px;margin:0 auto 8px}
.dc-intro-meta{display:inline-flex;gap:16px;margin-top:14px;font-size:13px;color:var(--mu);font-family:var(--fm)}
/* timer bar */
.dc-timer{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:14px;font-weight:600}
.dc-timer-ring{width:36px;height:36px;flex-shrink:0}
/* progress dots for cabinets */
.dc-cabinets-prog{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dc-cab-dot{width:30px;height:6px;border-radius:4px;background:var(--s3);transition:.3s}
.dc-cab-dot.done{background:var(--gn)}
.dc-cab-dot.current{background:var(--ac)}

/* ═══ MED CARD (printable PNG result) ═══ */
#medcard-stage{position:fixed;left:-9999px;top:0;width:794px;background:#fff} /* A4 width @96dpi, off-screen */
.mc{width:794px;min-height:1123px;background:#ffffff;font-family:'DM Sans',sans-serif;color:#1a1f2e;position:relative;overflow:hidden}
.mc-header{background:linear-gradient(135deg,#FF6B1A,#E85400);padding:36px 44px 30px;color:#fff;position:relative;overflow:hidden}
.mc-header::after{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(28,28,28,.08)}
.mc-header::before{content:'';position:absolute;bottom:-60px;left:30%;width:140px;height:140px;border-radius:50%;background:rgba(232,84,0,.15)}
.mc-clinic{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.mc-clinic-ic{width:56px;height:56px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.mc-clinic-name{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:800;letter-spacing:1px}
.mc-clinic-sub{font-size:13px;opacity:.85;margin-top:2px}
.mc-doc-label{position:absolute;top:36px;right:44px;background:rgba(28,28,28,.2);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:600;z-index:1}
.mc-title-band{margin-top:24px;position:relative;z-index:1}
.mc-title-band h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
.mc-title-band p{font-size:13px;opacity:.85;margin-top:2px}
/* patient row */
.mc-patient{display:flex;gap:30px;padding:26px 44px;border-bottom:2px dashed #e2e6ef;background:#fafbff}
.mc-pat-item{flex:1}
.mc-pat-label{font-size:11px;color:#8891a8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.mc-pat-val{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#1a1f2e}
.mc-pat-av{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#FF6B1A,#E85400);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
/* body */
.mc-body{padding:30px 44px}
.mc-section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#1a1f2e;margin-bottom:18px;display:flex;align-items:center;gap:8px}
/* skills bars */
.mc-skill{margin-bottom:16px}
.mc-skill-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mc-skill-ic{font-size:20px;width:28px;text-align:center}
.mc-skill-name{font-weight:600;font-size:14px;color:#1a1f2e;flex:1}
.mc-skill-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.mc-skill-track{height:16px;background:#eef1f7;border-radius:10px;overflow:hidden;margin-left:38px}
.mc-skill-fill{height:100%;border-radius:10px}
/* top skill highlight */
.mc-diagnosis{margin-top:26px;background:linear-gradient(135deg,#f0ecff,#e6f9f3);border:2px solid #d4caff;border-radius:18px;padding:24px;text-align:center}
.mc-diag-label{font-size:12px;color:#8891a8;text-transform:uppercase;letter-spacing:1px}
.mc-diag-skill{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;color:#E85400;margin:6px 0}
.mc-diag-rec{font-size:15px;color:#3a4256;line-height:1.5;font-weight:500}
/* prescription / next step */
.mc-rx{margin-top:20px;background:#fafbff;border-left:4px solid #34d399;border-radius:10px;padding:20px 24px}
.mc-rx-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#1a1f2e;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.mc-rx-text{font-size:13px;color:#3a4256;line-height:1.6}
/* footer */
.mc-footer{position:absolute;bottom:0;left:0;right:0;padding:20px 44px;border-top:2px solid #eef1f7;display:flex;justify-content:space-between;align-items:center;background:#fff}
.mc-footer-left{font-size:11px;color:#8891a8}
.mc-stamp{width:90px;height:90px;border:3px solid #34d399;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);opacity:.85}
.mc-stamp-txt{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;color:#34d399;text-align:center;line-height:1.2;text-transform:uppercase}
.mc-stamp-star{font-size:18px}
/* decorative stars for kid feel */
.mc-deco{position:absolute;font-size:20px;opacity:.12;pointer-events:none}
/* download button styling in result */
.dc-dl-btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:var(--fd);font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,#34d399,#059669);box-shadow:0 8px 24px rgba(52,211,153,.3);transition:.2s;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.dc-dl-btn:active{transform:scale(.97)}
.dc-dl-btn:disabled{opacity:.6;cursor:wait}

/* ═══ SERIOUS / OFFICIAL MED CARD ═══ */
.mc-serious{width:794px;min-height:1123px;background:#fff;font-family:'DM Sans',sans-serif;color:#1e2536;position:relative;padding:0;box-sizing:border-box}
.mc-s-header{display:flex;justify-content:space-between;align-items:flex-start;padding:34px 46px 0}
.mc-s-brand{display:flex;align-items:center;gap:14px}
.mc-s-logo{width:54px;height:54px;background:linear-gradient(135deg,#FF6B1A,#E85400);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.mc-s-clinic{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;color:#1e2536;letter-spacing:.5px}
.mc-s-clinic-sub{font-size:12px;color:#6b7488;margin-top:1px;letter-spacing:.3px}
.mc-s-protocol{text-align:right}
.mc-s-prot-no{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#1e3a8a}
.mc-s-prot-date{font-size:12px;color:#6b7488;margin-top:2px}
.mc-s-doctype{margin:22px 46px 0;padding:12px 0;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:800;letter-spacing:2px;color:#1e2536;border-top:2px solid #1e3a8a;border-bottom:2px solid #1e3a8a}
/* patient block */
.mc-s-patient{margin:22px 46px 0}
.mc-s-pat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0;border:1px solid #d5dae6;border-radius:8px;overflow:hidden}
.mc-s-pat-cell{padding:12px 16px;border-right:1px solid #d5dae6;border-bottom:1px solid #d5dae6;display:flex;flex-direction:column;gap:3px}
.mc-s-pat-wide{grid-column:span 4;border-right:none}
.mc-s-pat-grid .mc-s-pat-cell:nth-child(5){border-bottom:none}
.mc-s-pat-grid .mc-s-pat-cell:nth-child(2),.mc-s-pat-grid .mc-s-pat-cell:nth-child(3),.mc-s-pat-grid .mc-s-pat-cell:nth-child(4){border-bottom:none}
.mc-s-pat-grid .mc-s-pat-cell:last-child{border-right:none}
.mc-s-pl{font-size:10px;color:#8891a8;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.mc-s-pv{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#1e2536}
/* body */
.mc-s-body{padding:24px 46px 0}
.mc-s-sect{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;color:#1e3a8a;margin-bottom:12px}
.mc-s-table-head{display:flex;justify-content:space-between;font-size:10px;color:#8891a8;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding-bottom:8px;border-bottom:1px solid #e2e6ef;margin-bottom:12px}
/* reuse mc-skill but tweak */
.mc-serious .mc-skill{margin-bottom:13px}
.mc-serious .mc-skill-track{height:14px;background:#eef1f7;margin-left:36px}
.mc-s-overall{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:12px;border-top:1px solid #e2e6ef;font-weight:700;font-size:14px;color:#1e2536}
.mc-s-overall-val{font-family:'Space Grotesk',sans-serif;font-size:18px;color:#1e3a8a}
/* diagnosis */
.mc-s-diag{margin-top:22px;border:1px solid #c7d0e8;border-radius:10px;padding:18px 20px;background:#f7f9ff}
.mc-s-diag-label{font-size:11px;color:#8891a8;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px}
.mc-s-diag-skill{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;color:#1e3a8a;margin-bottom:8px}
.mc-s-diag-dir{font-size:13px;color:#3a4256;line-height:1.5}
/* medcard professions */
.mc-s-profs{margin-top:18px;border:1px solid #d5dae6;border-radius:10px;padding:16px 20px;background:#fff}
.mc-s-profs-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:800;letter-spacing:.5px;color:#1e3a8a;margin-bottom:12px}

// pick cabinet set by class (graded difficulty)
function dcCabinetsForClass(cls){
  if(cls<=2) return DC_CABINETS_1_2;
  if(cls<=5) return DC_CABINETS_3_5;
  if(cls<=8) return DC_CABINETS_6_8;
  return DC_CABINETS_9_11;
}

function dcSetClass(cls,el){
  _dc.cls=cls;

  document.querySelectorAll('.dc-class').forEach(a=>a.classList.remove('sel'));

}
function dcCheckReg(){
  const name=document.getElementById('dc-name').value.trim();

}

// STEP 3: start cabinets flow

let _dcTimer=null, _dcTimeLeft=0;
function dcEnterCabinet(){
  _dc.qIdx=0;
  renderDcQuestion();
}

function dcStartTimer(seconds){
  if(_dcTimer){clearInterval(_dcTimer);_dcTimer=null;}
  if(!seconds||seconds<=0){ // no limit
    const el=document.getElementById('dc-timer-txt'); if(el)el.textContent='♾';
    return;
  }
  _dcTimeLeft=seconds;
  const update=()=>{
    const el=document.getElementById('dc-timer-txt');
    const ring=document.getElementById('dc-timer-ring-fill');
    if(el)el.textContent=_dcTimeLeft+'s';
    if(ring){
      const cab=_dc.cabinets[_dc.cabIdx];
      const frac=_dcTimeLeft/cab.limit;
      const circ=2*Math.PI*15;
      ring.style.strokeDashoffset=circ*(1-frac);
      ring.style.stroke=_dcTimeLeft<=5?'#fb7185':'var(--ac)';
    }
    if(_dcTimeLeft<=0){
      clearInterval(_dcTimer);_dcTimer=null;
      dcTimeUp();
      return;
    }
    _dcTimeLeft--;
  };
  update();
  _dcTimer=setInterval(update,1000);
}

function dcTimeUp(){
  // time ran out — count as no-answer (skip), move on
  const cab=_dc.cabinets[_dc.cabIdx];
  const q=cab.questions[_dc.qIdx];
  _dc.counts[cab.skill]++; // counted but no score
  _dc.qIdx++;
  if(_dc.qIdx>=cab.questions.length){ dcFinishCabinet(); }
  else renderDcQuestion();
}

function renderDcQuestion(){
  const t=dct();
  const cab=_dc.cabinets[_dc.cabIdx];
  const q=cab.questions[_dc.qIdx];
  const sk=DC_SKILLS[cab.skill];
  const runner=document.getElementById('diag-runner');
  const prog=Math.round((_dc.qIdx/cab.questions.length)*100);

  // timer ring (only if limit)
  const timerHtml = cab.limit>0 ? `
    <div class="dc-timer">
      <svg class="dc-timer-ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15" fill="none" stroke="var(--s3)" stroke-width="3"/>
        <circle id="dc-timer-ring-fill" cx="18" cy="18" r="15" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${2*Math.PI*15}" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
      </svg>
      <span id="dc-timer-txt">${cab.limit}s</span>
    </div>` : `<span class="dc-timer" id="dc-timer-txt">♾</span>`;

  if(q.type==='memory'){
    runner.innerHTML=`<div class="dc-screen">
      <div class="dt-top">
        <button class="dt-back" onclick="loadDiagnostika()">${t.cancel}</button>
        <div class="dt-prog"><div class="dt-prog-fill" style="width:${prog}%"></div></div>
        ${timerHtml}
      </div>
      <div class="dt-q">
        <div class="dt-speaker" onclick="dcSpeak('${q.q[_dc.lang].replace(/'/g,"")}')">🔊</div>
        <div class="dt-skill-badge" style="background:${sk.color}22;color:${sk.color}">${sk.ic} ${sk[_dc.lang]}</div>
        <div class="dt-q-text">${q.q[_dc.lang]}</div>
        <div class="dt-q-hint">${q.hint[_dc.lang]}</div>
        <div class="dt-imgs" id="dc-mem-cards">${q.cards.map(c=>`<div class="dt-img-cell">${c}</div>`).join('')}</div>
        <div id="dc-mem-opts" style="display:none"></div>
      </div>
    </div>`;
    dcSpeak(q.q[_dc.lang]);
    // memory: NO timer during showing; show 3s then options (timer starts on options)
    setTimeout(()=>{
      const cards=document.getElementById('dc-mem-cards');
      const opts=document.getElementById('dc-mem-opts');
      if(!cards||!opts)return;
      cards.style.display='none';opts.style.display='block';
      opts.innerHTML=`<div class="dt-q-hint" style="margin-bottom:14px">${_dc.lang==='uz'?"Qaysi rasmlar bor edi? Hammasini tanla 👆":"Какие картинки были? Выбери все 👆"}</div>
        <div class="dt-imgs">${q.options.map(o=>`<div class="dt-img-cell" style="cursor:pointer" data-correct="${o.correct}" data-picked="0" onclick="dcMemPick(this)">${o.e}</div>`).join('')}</div>
        <button class="dc-btn" style="max-width:220px;margin:16px auto 0" onclick="dcMemDone()">${t.done}</button>`;
      if(cab.limit>0)dcStartTimer(cab.limit);
    },3000);
    return;
  }

  // choice
  runner.innerHTML=`<div class="dc-screen">
    <div class="dt-top">
      <button class="dt-back" onclick="loadDiagnostika()">${t.cancel}</button>
      <div class="dt-prog"><div class="dt-prog-fill" style="width:${prog}%"></div></div>
      ${timerHtml}
    </div>
    <div class="dt-q">
      <div class="dt-speaker" onclick="dcSpeak('${q.q[_dc.lang].replace(/'/g,"")}')">🔊</div>
      <div class="dt-skill-badge" style="background:${sk.color}22;color:${sk.color}">${sk.ic} ${sk[_dc.lang]}</div>
      <div class="dt-q-text">${q.q[_dc.lang]}</div>
      <div class="dt-q-hint">${q.hint[_dc.lang]}</div>
      <div class="dt-opts">
        ${q.opts.map((o,i)=>`<div class="dt-opt" onclick="dcChoose(${i})"><span class="dt-opt-emoji">${o.e}</span>${o[_dc.lang]}</div>`).join('')}
      </div>
    </div>
  </div>`;
  dcSpeak(q.q[_dc.lang]);
  if(cab.limit>0)dcStartTimer(cab.limit);
}

function dcSpeak(text){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=_dc.lang==='ru'?'ru-RU':'ru-RU';
    u.rate=0.85;
    speechSynthesis.speak(u);
  }catch(e){}
}

function dcChoose(i){
  if(_dcTimer){clearInterval(_dcTimer);_dcTimer=null;}
  const cab=_dc.cabinets[_dc.cabIdx];
  const q=cab.questions[_dc.qIdx];
  _dc.counts[cab.skill]++;
  if(q.creative || q.opts[i].correct){ _dc.scores[cab.skill]++; }
  _dc.qIdx++;
  if(_dc.qIdx>=cab.questions.length){ dcFinishCabinet(); }
  else renderDcQuestion();
}

function dcMemPick(el){
  const picked=el.dataset.picked==='1';
  el.dataset.picked=picked?'0':'1';
  el.style.borderColor=picked?'var(--brd)':'var(--ac)';
  el.style.transform=picked?'scale(1)':'scale(0.92)';
}
function dcMemDone(){
  if(_dcTimer){clearInterval(_dcTimer);_dcTimer=null;}
  const cab=_dc.cabinets[_dc.cabIdx];
  _dc.counts[cab.skill]++;
  const cells=document.querySelectorAll('#dc-mem-opts .dt-img-cell');
  let right=0,totalCorrect=0;
  cells.forEach(c=>{
    const isC=c.dataset.correct==='true', picked=c.dataset.picked==='1';
    if(isC)totalCorrect++;
    if(isC&&picked)right++;
    if(!isC&&picked)right-=0.5;
  });
  const ratio=Math.max(0,right/(totalCorrect||1));
  if(ratio>=0.6)_dc.scores[cab.skill]++;
  _dc.qIdx++;
  if(_dc.qIdx>=cab.questions.length){ dcFinishCabinet(); }
  else renderDcQuestion();
}

function dcFinishCabinet(){
  if(_dcTimer){clearInterval(_dcTimer);_dcTimer=null;}
  _dc.cabIdx++;
  renderDcIntro(); // next cabinet intro (or result if done)
}

// build professions block from top-2 skills (with Uzbekistan market demand)
function dcProfessionsBlock(pcts, t){
  const lang=_dc.lang;
  // top 2 skills
  const sorted=Object.keys(pcts).sort((a,b)=>pcts[b]-pcts[a]);
  const top2=[sorted[0], sorted[1]];
  // collect professions (dedupe), max 5
  let profs=[];
  top2.forEach(k=>{
    (DC_PROFESSIONS[k][lang]||[]).forEach(pr=>{
      if(!profs.find(x=>x.p===pr.p)) profs.push(pr);
    });
  });
  profs=profs.slice(0,5);
  const rows=profs.map(pr=>`<div class="dc-prof-row">
    <span class="dc-prof-name">${pr.p}</span>
    <span class="dc-prof-demand" title="${(DC_DEMAND_LEGEND[lang][pr.d]||'')}">${pr.d}</span>
  </div>`).join('');
  // legend
  const legend=Object.keys(DC_DEMAND_LEGEND[lang]).map(k=>`<span class="dc-prof-leg-item">${k} ${DC_DEMAND_LEGEND[lang][k]}</span>`).join('');
  return `<div class="dc-professions">
    <div class="dc-prof-head">
      <div class="dc-prof-title">💼 ${t.professionsTitle}</div>
      <div class="dc-prof-sub">${t.professionsSub}</div>
    </div>
    <div class="dc-prof-list">${rows}</div>
    <div class="dc-prof-legend">${legend}</div>
  </div>`;
}

  const GROWTH={
    uz:[
      `${skName(low)} yo'nalishini biroz mustahkamlash tavsiya etiladi — bu tabiiy o'sish nuqtasi.`,
      `Rivojlantirish uchun ${skDesc(low)}ga e'tibor qaratish foydali bo'ladi.`,
      `${skName(low)} hozircha shakllanish bosqichida — to'g'ri yondashuv bilan u ham kuchayadi.`,
      `Kelajakda ${skDesc(low)} ustida ishlash bolaning umumiy salohiyatini oshiradi.`
    ],
    ru:[
      `Рекомендуется немного укрепить направление ${skName(low)} — это естественная точка роста.`,
      `Для развития будет полезно уделить внимание ${skDesc(low)}.`,
      `${skName(low)} пока в стадии формирования — при правильном подходе тоже усилится.`,
      `В будущем работа над ${skDesc(low)} повысит общий потенциал ребёнка.`
    ]
  };

  // ── recommendation by profile ──
  const ADVICE={
    uz:[
      `Bolaning iste'dodini rivojlantirish uchun amaliy va interaktiv mashg'ulotlar eng samarali bo'ladi.`,
      `Tavsiya: bolaga o'z kuchli tomonini erkin namoyon qilish imkonini bering.`,
      `Eng yaxshi natija — bolaning tabiiy qiziqishlariga tayangan holda o'qitish.`,
      `Bola ijodiy muhitda, qo'llab-quvvatlash bilan tez rivojlanadi.`
    ],
    ru:[
      `Для развития таланта ребёнка наиболее эффективны практические и интерактивные занятия.`,
      `Рекомендация: дайте ребёнку возможность свободно проявлять свою сильную сторону.`,
      `Лучший результат — обучение с опорой на естественные интересы ребёнка.`,
      `Ребёнок быстро развивается в творческой среде при поддержке.`
    ]
  };

  // ── closing (varied, warm but professional) ──
  const CLOSE={
    uz:[
      `Umumiy baho: ${avg}%. Bola yaxshi salohiyatga ega va to'g'ri yo'nalishda rivojlanmoqda.`,
      `Xulosa: ${name}da kuchli poydevor mavjud, kelajak istiqbollari yorqin.`,
      `Yakuniy fikr: bolaning rivojlanish dinamikasi ijobiy, salohiyati yuqori.`
    ],
    ru:[
      `Общая оценка: ${avg}%. Ребёнок обладает хорошим потенциалом и развивается в правильном направлении.`,
      `Вывод: у ${name} есть прочный фундамент, перспективы развития яркие.`,
      `Итоговое мнение: динамика развития положительная, потенциал высокий.`
    ]
  };

  // assemble — pick one from each, sometimes skip second-strength for variety
  // ── market/profession sentence (ties top skill to real Uzbekistan professions) ──
  const topProfs=(DC_PROFESSIONS[top] && DC_PROFESSIONS[top][lang]) || [];
  const hotProf=topProfs.find(p=>p.d==='🔥')||topProfs[0];
  const profName=hotProf?hotProf.p:'';
  const MARKET={
    uz:[
      `Bu yo'nalish O'zbekiston bozorida talab yuqori — masalan, "${profName}" kabi kasblar kelajakda istiqbolli.`,
      `Mehnat bozori nuqtai nazaridan bu kuchli tomon foydali: "${profName}" sohasi rivojlanmoqda.`,
      `Bola ulg'aygach, "${profName}" kabi yo'nalishlarda o'zini topishi mumkin — bozorda bunga talab bor.`
    ],
    ru:[
      `Это направление востребовано на рынке Узбекистана — например, профессии вроде "${profName}" перспективны.`,
      `С точки зрения рынка труда эта сильная сторона выгодна: сфера "${profName}" растёт.`,
      `Когда ребёнок вырастет, он может реализоваться в направлениях вроде "${profName}" — спрос на рынке есть.`
    ]
  };

  const parts=[rnd(OPEN[lang]), rnd(STRONG[lang])];
  if(r.pcts[second]>=70) parts.push(rnd(SECOND[lang]));
  if(profName) parts.push(rnd(MARKET[lang]));
  parts.push(rnd(GROWTH[lang]));
  parts.push(rnd(ADVICE[lang]));
  parts.push(rnd(CLOSE[lang]));
  return parts.join(' ');
}

function dcDownloadCard(){
  const t=dct();
  const btn=document.getElementById('dc-dl-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ '+(_dc.lang==='uz'?"Tayyorlanmoqda...":"Готовится...");}
  buildMedCard();
  const stage=document.getElementById('medcard-stage');
  const card=stage.querySelector('.mc');
  // wait a tick for fonts/layout
  setTimeout(()=>{
    if(typeof html2canvas==='undefined'){
      // fallback: open print dialog
      if(btn){btn.disabled=false;btn.textContent='📄 '+t.downloadCard;}
      toast(_dc.lang==='uz'?"Yuklab bo'lmadi, qayta urinib ko'ring":"Не удалось, попробуйте снова",'err');
      return;
    }
    html2canvas(card,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true}).then(canvas=>{
      const link=document.createElement('a');
      const safeName=(_dc.name||'natija').replace(/[^a-zA-Zа-яА-Я0-9]/g,'_');
      link.download='EduNova_'+safeName+'.png';
      link.href=canvas.toDataURL('image/png');
      link.click();
      if(btn){btn.disabled=false;btn.textContent='✓ '+t.downloadCard;}
    }).catch(e=>{
      console.error('PNG error',e);
      if(btn){btn.disabled=false;btn.textContent='📄 '+t.downloadCard;}
    });
  },300);
}

// professions for the printed med-card (top-2 skills, with market demand)
function dcMedCardProfessions(r, L){
  const lang=_dc.lang;
  const sorted=Object.keys(r.pcts).sort((a,b)=>r.pcts[b]-r.pcts[a]);
  const top2=[sorted[0], sorted[1]];
  let profs=[];
  top2.forEach(k=>{
    (DC_PROFESSIONS[k][lang]||[]).forEach(pr=>{ if(!profs.find(x=>x.p===pr.p)) profs.push(pr); });
  });
  profs=profs.slice(0,5);
  const rows=profs.map(pr=>`<div class="mc-s-prof-row"><span>${pr.p}</span><span class="mc-s-prof-dem">${pr.d} ${DC_DEMAND_LEGEND[lang][pr.d]||''}</span></div>`).join('');
  return `<div class="mc-s-profs">
    <div class="mc-s-profs-title">💼 ${L.profsTitle}</div>
    <div class="mc-s-profs-list">${rows}</div>
  </div>`;
}
