<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F6F1E6">

<title>EduNova · Boshqaruv paneli</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--s:#F6F1E6;--c:#FFFFFF;--tx:#1C1C1C;--mu:#6E6A61;--brd:#DED7C7;--ac:#FF6B1A;--acd:#E85400;--gn:#1F9D55;--rd:#D93838;--am:#C77700;--bl:#2563EB;--r:12px}
html,body{margin:0;padding:0}
body{background:var(--s);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--acd)}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--brd);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
.fld{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.btn:active{background:var(--acd)}
.btn:disabled{opacity:.55}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--brd)}
.btn.dan{background:#fff;color:var(--rd);border:1px solid #F0C9C9}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 96px}
.top{position:sticky;top:0;z-index:30;background:rgba(246,241,230,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--brd)}
.topin{max-width:960px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--mu)}
.til{display:flex;border:1px solid var(--brd);border-radius:9px;overflow:hidden;background:#fff;flex:none}
.til-btn{padding:6px 9px;border:0;background:none;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer}
.til-btn.on{background:var(--ac);color:#fff}
.card{background:var(--c);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin:12px 0}
.card h2{font-size:16px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.mu{color:var(--mu)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:600}
.mt{margin-top:10px}
.center{text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--brd);background:#fff}
.pill.gn{background:#E6F6EC;color:#166534;border-color:#BFE5CD}
.pill.rd{background:#FCE9E9;color:#991B1B;border-color:#F3C9C9}
.pill.am{background:#FDF2DC;color:#8A5A00;border-color:#F0DDB4}
.pill.bl{background:#E6EEFD;color:#1E40AF;border-color:#C7D8F8}
.pill.mu{background:#F1EDE3;color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.tab{flex:none;padding:8px 13px;border:1px solid var(--brd);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lst{list-style:none;margin:0;padding:0}
.it{border:1px solid var(--brd);border-radius:10px;background:#fff;padding:11px;margin-bottom:8px}
.it .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--brd);padding:8px 6px;text-align:left;vertical-align:middle}
.tbl th{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:22px 10px;text-align:center;color:var(--mu);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:22px;z-index:200;max-width:88%;padding:11px 16px;border-radius:11px;background:#1C1C1C;color:#fff;font-size:14px;transition:transform .22s;box-shadow:0 6px 22px rgba(0,0,0,.2)}
.toast.kor{transform:translateX(-50%) translateY(0)}
.toast.xato{background:var(--rd)}
.toast.ok{background:#1F7A45}
.kirish{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.kbox{width:100%;max-width:330px;text-align:center}
.kbox h1{font-size:21px;margin-bottom:4px}
.kbox p{color:var(--mu);font-size:13px;margin:0 0 16px}
#pin{text-align:center;letter-spacing:.5em;font-size:24px;padding:14px;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad b{padding:15px 0;border:1px solid var(--brd);border-radius:11px;background:#fff;font-size:19px;font-weight:600;cursor:pointer;user-select:none}
.pad b:active{background:#F1EDE3}
.modal{position:fixed;inset:0;z-index:150;background:rgba(20,18,14,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--c);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:16px}}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .mh h2{font-size:17px;margin:0;flex:1}
.x{border:0;background:#F1EDE3;width:32px;height:32px;border-radius:9px;font-size:19px;cursor:pointer;color:var(--mu);flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--brd);display:flex;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
.nav b{flex:1;text-align:center;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--mu);cursor:pointer;border-radius:9px;line-height:1.25}
.nav b i{display:block;font-size:17px;font-style:normal;margin-bottom:1px}
.nav b.on{color:var(--acd);background:#FDF0E6}
.yuk{position:fixed;inset:0;background:var(--s);display:flex;align-items:center;justify-content:center;z-index:300;color:var(--mu)}
.spin{width:26px;height:26px;border:3px solid var(--brd);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:7px;border-radius:99px;background:#EFEADF;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;gap:5px}
.chk b{flex:1;text-align:center;padding:7px 2px;border:1px solid var(--brd);border-radius:9px;background:#fff;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none}
.chk b.on.g{background:#E6F6EC;border-color:#87CFA5;color:#166534}
.chk b.on.r{background:#FDF2DC;border-color:#E7C588;color:#8A5A00}
.chk b.on.k{background:#FCE9E9;border-color:#EFB4B4;color:#991B1B}
.kod{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.12em}
.print-folder{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.print-folder .pf-icon{font-size:34px;line-height:1}
.print-folder .pf-main{flex:1;min-width:170px}
.print-folder .pf-title{font-size:18px;font-weight:700}
.print-classes{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.print-total{font-size:12px;color:var(--mu);margin-top:3px}

.pill.sari{background:#FFF3D6;color:#8a5b00;border:1px solid #f0d9a0}
.msh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd,#dfe4ec);border:1px solid var(--bd,#dfe4ec);border-radius:10px;overflow:hidden;margin-bottom:14px}
.msh-stats>div{background:var(--cd,#fff);padding:12px 14px}
.msh-stats b{display:block;font-size:24px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.msh-stats span{font-size:12px;color:var(--mu,#64748b)}
.msh-stats .s-ok b{color:#12805c}.msh-stats .s-wait b{color:#b45309}.msh-stats .s-no b{color:#7c8899}
.msh-ogoh{background:#FFF3D6;border:1px solid #f0d9a0;color:#8a5b00;padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:12px}
.msh-ogoh b{display:block;margin-bottom:3px}
.msh-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msh-tabs{display:flex;border:1px solid var(--bd,#dfe4ec);border-radius:8px;overflow:hidden}
.msh-tabs button{border:0;border-right:1px solid var(--bd,#dfe4ec);background:var(--cd,#fff);color:inherit;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.msh-tabs button:last-child{border-right:0}
.msh-tabs button.on{background:#16202e;color:#fff}
.msh-bar input{flex:1;min-width:170px;font:inherit;padding:8px 12px;border:1px solid var(--bd,#dfe4ec);border-radius:8px;background:var(--cd,#fff);color:inherit}
.msh-row{border:1px solid var(--bd,#dfe4ec);border-radius:10px;background:var(--cd,#fff);margin-bottom:8px}
.msh-row.wait{border-color:#f0d9a0}
.msh-head{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-radius:9px}
.msh-nm{flex:1;min-width:0}
.msh-nm b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msh-nm small{color:var(--mu,#64748b);font-size:12.5px}
.msh-bg{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.msh-bg.ok{background:#E6F4EE;color:#12805c}.msh-bg.wait{background:#FFF3D6;color:#8a5b00}
.msh-bg.no{background:#EEF1F5;color:#7c8899}.msh-bg.bad{background:#FDEAEF;color:#be123c}
.msh-bd{display:none;border-top:1px solid var(--bd,#dfe4ec);padding:14px}
.msh-row.open .msh-bd{display:block}
.msh-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px 20px;margin:0 0 12px}
.msh-kv dt{font-size:12px;color:var(--mu,#64748b);margin-bottom:2px}
.msh-kv dd{margin:0;font-size:14px;word-break:break-word;font-variant-numeric:tabular-nums}
.msh-kv dd.hid{cursor:pointer;border-bottom:1px dashed var(--bd,#dfe4ec);display:inline-block}
.msh-kv dd.yoq{color:#94a3b8}
.msh-izoh{background:var(--bg,#f4f6f9);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.msh-act{display:flex;gap:8px;flex-wrap:wrap}
.msh-act button{font:inherit;cursor:pointer;padding:8px 15px;border-radius:8px;border:1px solid var(--bd,#dfe4ec);background:var(--cd,#fff);color:inherit}
.msh-act .b-ok{background:#1F7A45;border-color:#1F7A45;color:#fff}
.msh-act .b-bad{color:#be123c;border-color:#f0c4ce}
@media(max-width:640px){.msh-stats{grid-template-columns:repeat(2,1fr)}.msh-stats b{font-size:20px}}
</style>
</head>

let LANG=localStorage.getItem('ep_lang')||'uz';

async function rpc(fn,args){
  let r;
  try{
    r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify(args||{})});
  }catch(e){ throw new Error('NET'); }
  let d=null;
  try{ d=await r.json(); }catch(e){ d=null; }
  if(!r.ok){
    const m=(d&&(d.message||d.hint))||('HTTP '+r.status);
    if(/SESSIYA|RUXSAT/.test(m)) { chiqishMajburiy(); throw new Error('SESSIYA'); }
    throw new Error(m);
  }
  return d;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function pul(n){ n=Number(n||0); return n.toLocaleString('ru-RU').replace(/\u00a0/g,' ')+' so\'m'; }
function d2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()); }
function pd(s){ const p=String(s||'').slice(0,10).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function sanaMatn(s){ if(!s) return ''; const d=pd(s); return d2(d.getDate())+'.'+d2(d.getMonth()+1)+'.'+d.getFullYear(); }
function oyMatn(s){ const d=pd(s); return (t('oylar')[d.getMonth()])+' '+d.getFullYear(); }
function vaqtMatn(s){ if(!s) return '—'; const d=new Date(s); return d2(d.getHours())+':'+d2(d.getMinutes()); }
function t(k){ const v=I18N[LANG]&&I18N[LANG][k]; return v===undefined?(I18N.uz[k]===undefined?k:I18N.uz[k]):v; }

function tilBelgila(l){
  LANG=(l==='ru')?'ru':'uz';
  localStorage.setItem('ep_lang',LANG);
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-tl]').forEach(e=>{ e.textContent=t(e.dataset.tl); });
  document.querySelectorAll('[data-tlp]').forEach(e=>{ e.placeholder=t(e.dataset.tlp); });
  document.querySelectorAll('.til-btn').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  if(typeof qaytaChiz==='function' && T) qaytaChiz();
}

function xabar(m,turi){
  const el=$('toast'); if(!el) return;
  el.textContent=m; el.className='toast '+(turi||'ok')+' kor';
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.className='toast'; },3500);
}
function xatoMatn(e){
  const m=String(e&&e.message||e);
  const map={NET:t('x_net'),PIN:t('x_pin'),URINISH:t('x_urinish'),SESSIYA:t('x_sessiya'),MATN:t('x_matn'),MAVZU:t('x_mavzu'),QULF:t('x_qulf'),ISM:t('x_ism'),SINF:t('x_sinf'),BOR:t('x_bor'),SUMMA:t('x_summa'),OY:t('x_oy'),NOM:t('x_nom'),RAQAM:t('x_raqam'),FAN:t('x_fan'),TURI:t('x_turi'),BOLA:t('x_bola'),BAND:t('x_band'),UZUNLIK:t('x_uzunlik')};
  return map[m]||m;
}

function chiqishMajburiy(){
  T=''; localStorage.removeItem(TK);
  const k=$('kirish'), a=$('ilova'), y=$('yuk');
  if(y) y.style.display='none';
  if(k&&a){ a.style.display='none'; k.style.display='flex'; const p=$('pin'); if(p) p.value=''; }
  const m=$('modal'); if(m) m.style.display='none';
}
async function chiqish(){
  try{ if(T) await rpc('ep_chiqish',{p_token:T}); }catch(e){}
  chiqishMajburiy();
}

function pinKirit(){
  const inp=$('pin'), btn=$('kirBtn');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') kir(); });
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/\D/g,'').slice(0,9); });
  btn.addEventListener('click',kir);
  document.querySelectorAll('.pad b').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v;
    if(v==='x') inp.value=inp.value.slice(0,-1);
    else if(v==='ok') kir();
    else if(inp.value.length<9) inp.value+=v;
  }));
}
async function kir(){
  const inp=$('pin'), btn=$('kirBtn');
  if(inp.value.length<4){ xabar(t('x_pin'),'xato'); return; }
  btn.disabled=true; btn.textContent=t('kutish');
  try{
    const d=await rpc('ep_kirish',{p_pin:inp.value});
    if(!d||!d.ok){ xabar(xatoMatn(new Error(d&&d.xato||'PIN')),'xato'); inp.value=''; return; }
    if(d.rol!==ROLE){ xabar(t('x_rol_'+d.rol)||t('x_rol'),'xato'); inp.value=''; return; }
    T=d.token; localStorage.setItem(TK,T);
    if(d.til&&!localStorage.getItem('ep_lang')) tilBelgila(d.til);
    inp.value='';
    await boshla();
  }catch(e){ xabar(xatoMatn(e),'xato'); }
  finally{ btn.disabled=false; btn.textContent=t('kirish_btn'); }
}

async function ishga(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('.til-btn').forEach(b=>b.addEventListener('click',()=>tilBelgila(b.dataset.lang)));
  pinKirit();
  tilBelgila(LANG);
  if(T){
    try{
      const m=await rpc('ep_men',{p_token:T});
      if(m&&m.ok&&m.rol===ROLE){ await boshla(); return; }
    }catch(e){}
    chiqishMajburiy();
  }
  $('yuk').style.display='none';
  if(!T){ $('kirish').style.display='flex'; $('ilova').style.display='none'; }
}

function gzChiz(){
  var c=document.getElementById('gz'); if(!c||!BHD)return;
  var x=c.getContext('2d'), W=620,H=380, cx=W/2, cy=300, R=230;
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  [['#dc2626',0,.2],['#f59e0b',.2,.4],['#eab308',.4,.6],['#84cc16',.6,.8],['#16a34a',.8,1]].forEach(function(s){
    x.beginPath(); x.lineWidth=52; x.strokeStyle=s[0];
    x.arc(cx,cy,R,Math.PI+Math.PI*s[1],Math.PI+Math.PI*s[2]); x.stroke();
  });
  for(var i=1;i<=5;i++){ var an=Math.PI+Math.PI*((i-.5)/5);
    x.fillStyle='#fff'; x.font='bold 20px sans-serif'; x.textAlign='center';
    x.fillText(String(i), cx+Math.cos(an)*R, cy+Math.sin(an)*R+7); }
  var v=Math.max(1,Math.min(5,parseFloat(BHD.ortacha)||1));
  var ang=Math.PI+Math.PI*((v-1)/4*.96+.02);
  x.save(); x.translate(cx,cy); x.rotate(ang);
  x.beginPath(); x.moveTo(0,-9); x.lineTo(R-30,0); x.lineTo(0,9); x.closePath();
  x.fillStyle='#1A2238'; x.fill(); x.restore();
  x.beginPath(); x.arc(cx,cy,18,0,7); x.fillStyle='#1A2238'; x.fill();
  x.fillStyle='#1A2238'; x.font='bold 64px sans-serif'; x.textAlign='center';
  x.fillText(String(BHD.ortacha), cx, cy-60);
  x.font='16px sans-serif'; x.fillStyle='#8b8271';
  x.fillText('5 balldan \u00b7 '+BHD.jami+' ta javob', cx, cy-25);
  x.font='bold 18px sans-serif'; x.fillStyle='#1A2238';
  x.fillText('EduNova School \u2014 tizim bahosi', cx, 40);
}

function joylashuvOl(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({xato:'yoq'});
    let tugadi=false;
    const vaqt=setTimeout(()=>{ if(!tugadi){ tugadi=true; res({xato:'vaqt'}); } }, 15000);
    navigator.geolocation.getCurrentPosition(
      p=>{ if(tugadi) return; tugadi=true; clearTimeout(vaqt);
           res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}); },
      e=>{ if(tugadi) return; tugadi=true; clearTimeout(vaqt); res({xato:e&&e.code===1?'ruxsat':'yoq'}); },
      {enableHighAccuracy:true, timeout:14000, maximumAge:0});
  });
}

function qrChiz(url){
  const box=$('qrbox');
  box.innerHTML='<div id="qrimg" class="xs mu">'+t('yuklanmoqda')+'</div>'+
                '<div class="xs mu mt" style="word-break:break-all">'+esc(url)+'</div>';
  const draw=()=>{
    const im=$('qrimg'); if(!im) return;
    try{ const q=qrcode(0,'M'); q.addData(url); q.make(); im.innerHTML=q.createImgTag(6,8); }
    catch(e){ im.textContent=t('qr_rasm_yoq'); }
  };
  if(window.qrcode) return draw();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload=draw; s.onerror=()=>{ const im=$('qrimg'); if(im) im.textContent=t('qr_rasm_yoq'); };
  document.head.appendChild(s);
}

function qatorAjrat(s){
  return s.split(/\r?\n/).map(l=>l.trim()).filter(l=>l).map(l=>{
    const p=l.split(/\t|;|\||,(?=\s*\S)/).map(x=>x.trim());
    return {ism:p[0]||'',sinf:p[1]||'',ota_ism:p[2]||'',telefon:p[3]||''};
  });
}

    '<div class="row mt"><span class="xs mu" style="flex:1">'+t('joy_talab')+'</span>'+
    '<button class="btn '+(SOZ.qr_joylashuv==='ha'?'':'sec ')+'sm" onclick="joyTalab()">'+(SOZ.qr_joylashuv==='ha'?t('yoqilgan'):t('ochirilgan'))+'</button></div>'+
    '<button class="btn mt" style="width:100%" onclick="radiusSaqla()">'+t('saqlash')+'</button></div>';
  h+='<div class="card"><h3>'+t('dars_vaqtlari')+'</h3><div id="dv_body">';
  dv.forEach((v,i)=>{ h+=dvQator(v.n,v.b,v.o); });
  h+='</div><div class="row mt"><button class="btn sec sm" onclick="dvQosh()">+</button><button class="btn sm" onclick="dvSaqla()">'+t('saqlash')+'</button></div></div>';
  h+='<div class="card"><h3>'+t('fanlar')+'</h3><textarea id="s_fan" style="min-height:120px">'+esc((SOZ.fanlar||[]).join('\n'))+'</textarea>'+
    '<button class="btn mt" style="width:100%" onclick="fanSaqla()">'+t('saqlash')+'</button></div>';
  h+='<div class="card"><h3>'+t('sinflar')+'</h3><div class="row"><input id="s_sinf" placeholder="5-A" style="flex:1"><button class="btn sm" onclick="sinfQosh()">'+t('sinf_qosh')+'</button></div>'+
    '<div class="scroll mt"><table class="tbl"><tr><th>'+t('sinf')+'</th><th>'+t('n_oquvchilar')+'</th><th></th><th></th></tr>';
  SINFLAR.forEach(s2=>{
    h+='<tr><td>'+esc(s2.nom)+'</td><td>'+s2.oquvchilar+'</td><td>'+esc(s2.til)+'</td>'+
      '<td><button class="btn sec sm" onclick="sinfFaol('+s2.id+',\''+esc(s2.nom)+'\','+(!s2.faol)+')">'+(s2.faol?t('faol'):t('nofaol'))+'</button></td></tr>';
  });
  h+='</table></div></div>';
  h+='<div class="card"><h3>'+t('admin_pin')+'</h3><div class="row"><input id="s_pin" inputmode="numeric" placeholder="6–9" style="flex:1"><button class="btn sm" onclick="adminPin()">'+t('saqlash')+'</button></div></div>';
  h+='<div class="center mt"><button class="btn sec" onclick="chiqish()">'+t('chiqish')+'</button></div>';
  $('cont').innerHTML=h;
}
function fld(k,id,v,tip){ return '<div class="fld"><label>'+t(k)+'</label><input id="'+id+'" type="'+(tip||'text')+'" value="'+esc(v)+'"></div>'; }
function dvQator(n,b,o){
  return '<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input data-dv="n" value="'+esc(n)+'" inputmode="numeric" style="width:52px;padding:7px">'+
    '<input data-dv="b" value="'+esc(b)+'" type="time" style="flex:1;padding:7px"><input data-dv="o" value="'+esc(o)+'" type="time" style="flex:1;padding:7px">'+
    '<button class="btn dan sm" onclick="this.parentNode.remove()">×</button></div>';
}
function dvQosh(){ const n=document.querySelectorAll('[data-dv="n"]').length+1; $('dv_body').insertAdjacentHTML('beforeend',dvQator(n,'','')); }
async function dvSaqla(){
  const ns=document.querySelectorAll('[data-dv="n"]'), bs=document.querySelectorAll('[data-dv="b"]'), os=document.querySelectorAll('[data-dv="o"]');
  const arr=[];
  for(let i=0;i<ns.length;i++){ const n=+ns[i].value; if(!n) continue; arr.push({n:n,b:bs[i].value,o:os[i].value}); }
  arr.sort((a,b)=>a.n-b.n);
  await soz('dars_vaqtlari',arr);
}
async function fanSaqla(){
  const arr=$('s_fan').value.split(/\r?\n/).map(x=>x.trim()).filter(x=>x);
  await soz('fanlar',arr);
}
async function soz(k,v){
  try{
    const d=await rpc('ep_sozlama_saqla',{p_token:T,p_kalit:k,p_qiymat:v});
    if(!d.ok){ xabar(xatoMatn(new Error(d.xato)),'xato'); return false; }
    xabar(t('tayyor')); return true;
  }catch(e){ xabar(xatoMatn(e),'xato'); return false; }
}
async function sozSaqla(){
  const p=[['maktab',$('s_maktab').value],['narx',$('s_narx').value.replace(/\D/g,'')],['tolov_kuni',$('s_kun').value.replace(/\D/g,'')],
    ['eslatma_kun',$('s_esl').value.replace(/\D/g,'')],['oy_soni',$('s_oy').value.replace(/\D/g,'')],
    ['oquv_yili_boshi',$('s_yil').value],['mavsum_boshi',$('s_mav').value],['tg_bot',$('s_bot').value.replace('@','')]];
  for(const [k,v] of p){ if(v==='') continue; const ok=await soz(k,v); if(!ok) return; }
  chizSozlama();
}
async function sinfQosh(){
  const v=$('s_sinf').value.trim();
  if(!v){ xabar(t('x_nom'),'xato'); return; }
  try{
    const d=await rpc('ep_sinf_saqla',{p_token:T,p_id:null,p_nom:v,p_til:null,p_faol:true});
    if(!d.ok){ xabar(xatoMatn(new Error(d.xato)),'xato'); return; }
    xabar(t('tayyor')); chizSozlama();
  }catch(e){ xabar(xatoMatn(e),'xato'); }
}
async function sinfFaol(id,nom,faol){
  try{
    const d=await rpc('ep_sinf_saqla',{p_token:T,p_id:id,p_nom:nom,p_til:null,p_faol:faol});
    if(!d.ok){ xabar(xatoMatn(new Error(d.xato)),'xato'); return; }
    chizSozlama();
  }catch(e){ xabar(xatoMatn(e),'xato'); }
}
async function adminPin(){
  const v=$('s_pin').value.replace(/\D/g,'');
  if(v.length<6||v.length>9){ xabar(t('x_uzunlik'),'xato'); return; }
  if(!confirm(t('tasdiq'))) return;
  try{
    const d=await rpc('ep_admin_pin_ozgartir',{p_token:T,p_yangi:v});
    if(!d.ok){ xabar(xatoMatn(new Error(d.xato)),'xato'); return; }
    $('s_pin').value=''; pinKorsat(t('admin_pin'),v);
  }catch(e){ xabar(xatoMatn(e),'xato'); }
}
function nusxa(s){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(()=>xabar(t('nusxalandi'))).catch(()=>{});
  else{ const i=document.createElement('input'); i.value=s; document.body.appendChild(i); i.select(); try{document.execCommand('copy'); xabar(t('nusxalandi'));}catch(e){} i.remove(); }
}
function modalOch(h){
  let m=$('modal');
  if(!m){ m=document.createElement('div'); m.id='modal'; m.className='modal'; document.body.appendChild(m);
    m.addEventListener('click',e=>{ if(e.target===m) modalYop(); }); }
  m.innerHTML='<div class="box">'+h+'</div>';
  m.style.display='flex';
}
function modalYop(){ const m=$('modal'); if(m) m.style.display='none'; }

/* ---------------- MEHNAT SHARTNOMALARI ---------------- */
let MSH_D=null, MSH_F='all', MSH_Q='';

function mshHolat(h){
  const s=String(h||'').toLowerCase();
  if(/rad|bekor/.test(s)) return 'bad';
  if(/tasdiq/.test(s))    return 'ok';
  if(/kut|yubor|yangi|jarayon/.test(s)) return 'wait';
  return 'no';
}
const MSH_NOM={ok:'Tasdiqlangan',wait:'Tasdiq kutmoqda',no:'Shartnomasiz',bad:'Rad etilgan'};
function mshMask(v){ v=String(v||''); if(!v) return ''; return v.length<=4?v:v.slice(0,2)+'\u2022'.repeat(v.length-4)+v.slice(-2); }

async function chizShartnoma(){
  MSH_D = await rpc('ep_msh_royxat',{p_token:T});
  mshChiz();
}

function mshChiz(){
  const d=MSH_D||{}, royxat=d.royxat||[], bog=d.boglanmagan||[];
  const jami=d.jami??royxat.length, bor=d.bor??0, kut=d.kutmoqda??0;

  const rows=royxat.map(r=>({r, h:mshHolat(r.holat)}))
    .filter(x=> (MSH_F==='all') || (MSH_F==='no' ? (x.h==='no'||x.h==='bad') : x.h===MSH_F))
    .filter(x=> !MSH_Q || ((x.r.ism||'')+' '+(x.r.lavozim||'')).toLowerCase().includes(MSH_Q))
    .sort((a,b)=>{const o={wait:0,no:1,bad:2,ok:3};
      return (o[a.h]-o[b.h]) || String(a.r.ism||'').localeCompare(String(b.r.ism||''),'uz');});

  let h='<div class="msh-stats">'+
    '<div><b>'+jami+'</b><span>Jami o\'qituvchi</span></div>'+
    '<div class="s-ok"><b>'+bor+'</b><span>Shartnomasi bor</span></div>'+
    '<div class="s-wait"><b>'+kut+'</b><span>Tasdiq kutmoqda</span></div>'+
    '<div class="s-no"><b>'+Math.max(0,jami-bor-kut)+'</b><span>Rasmiylashtirilmagan</span></div></div>';

  if(bog.length) h+='<div class="msh-ogoh"><b>O\'qituvchiga bog\'lanmagan '+bog.length+' ta yozuv</b>'+
    esc(bog.map(x=>x.fio).join(', '))+' \u2014 bular ep_odam jadvalidagi hech kimga ulanmagan.</div>';

  h+='<div class="msh-bar"><div class="msh-tabs">'+
    [['all','Hammasi'],['wait','Kutmoqda'],['ok','Shartnomali'],['no','Shartnomasiz']]
      .map(([k,n])=>'<button onclick="MSH_F=\''+k+'\';mshChiz()"'+(MSH_F===k?' class="on"':'')+'>'+n+'</button>').join('')+
    '</div><input type="search" id="mshQ" placeholder="Ism yoki lavozim" value="'+esc(MSH_Q)+'"></div>';

  if(!rows.length){ h+='<div class="empty">Bu shart bo\'yicha yozuv yo\'q</div>'; }
  else rows.forEach(({r,h:st},i)=>{
    h+='<div class="msh-row '+st+'" id="mshr'+i+'">'+
       '<div class="msh-head" onclick="$(\'mshr'+i+'\').classList.toggle(\'open\')">'+
         '<span class="msh-nm"><b>'+esc(r.ism||'Ismi ko\'rsatilmagan')+'</b><small>'+
           esc([r.lavozim,r.tel].filter(Boolean).join(' \u00b7 ')||'ma\'lumot kiritilmagan')+'</small></span>'+
         '<span class="msh-bg '+st+'">'+MSH_NOM[st]+'</span></div><div class="msh-bd">';
    if(st==='no'){
      h+='<div class="empty" style="padding:16px">Ariza yuborilmagan. O\'qituvchi <b>mehnat-shartnoma.html</b> sahifasida o\'z PIN kodi bilan to\'ldiradi.</div>';
    }else{
      const kv=(t,v,hid)=>{
        if(v==null||v==='') return '<div><dt>'+t+'</dt><dd class="yoq">kiritilmagan</dd></div>';
        return '<div><dt>'+t+'</dt><dd'+(hid?' class="hid" title="Ko\'rsatish" onclick="mshOch(this,\''+esc(String(v))+'\')"':'')+'>'+
               esc(hid?mshMask(v):v)+'</dd></div>';};
      h+='<dl class="msh-kv">'+
        kv('Shartnoma raqami',r.raqam)+kv('Pasport',r.pasport,1)+kv('JSHSHIR',r.pinfl,1)+
        kv('Tug\'ilgan sana',r.tugilgan?sanaMatn(r.tugilgan):'')+kv('Manzil',r.manzil)+kv('Lavozim',r.lavozim)+
        kv('Boshlanish sanasi',r.boshlanish?sanaMatn(r.boshlanish):'')+
        kv('Haftadagi ish kuni',r.kun)+kv('Haftalik soat',r.soat)+
        kv('Bir soatlik to\'lov',r.soatlik?pul(r.soatlik):'')+kv('Oylik maosh',r.oylik?pul(r.oylik):'')+
        kv('Imzo',r.imzo?'qo\'yilgan':'')+'</dl>';
      if(r.izoh) h+='<div class="msh-izoh">'+esc(r.izoh)+'</div>';
      if(st==='wait') h+='<div class="msh-act">'+
        '<button class="b-ok" onclick="mshTasdiq('+(r.sh_id??r.id)+','+r.id+',true)">Tasdiqlash</button>'+
        '<button class="b-bad" onclick="mshTasdiq('+(r.sh_id??r.id)+','+r.id+',false)">Rad etish</button></div>';
    }
    h+='</div></div>';
  });

  $('cont').innerHTML=h;
  const q=$('mshQ');
  if(q){ q.oninput=e=>{ clearTimeout(window._mshT);
    window._mshT=setTimeout(()=>{ MSH_Q=e.target.value.trim().toLowerCase(); mshChiz();
      const n=$('mshQ'); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} },200); }; }
}

function mshOch(el,val){ el.textContent = el.textContent.indexOf('\u2022')>=0 ? val : mshMask(val); }

async function mshTasdiq(shId,odamId,ok){
  const r=(MSH_D.royxat||[]).find(x=>x.id===odamId)||{};
  if(!confirm((ok?'Shartnoma tasdiqlansinmi?':'Ariza rad etilsinmi?')+'\n\n'+(r.ism||''))) return;
  const oldi=mshHolat(r.holat);
  try{
    /* ep_msh_tasdiq mavjud bo'lmagan id da ham {ok:true} qaytaradi,
       shuning uchun ro'yxatni qayta olib holat haqiqatan o'zgarganini tekshiramiz */
    await rpc('ep_msh_tasdiq',{p_token:T,p_id:shId,p_ok:ok});
    MSH_D=await rpc('ep_msh_royxat',{p_token:T});
    const yangi=(MSH_D.royxat||[]).find(x=>x.id===odamId);
    mshChiz();
    if(yangi && mshHolat(yangi.holat)===oldi)
      xabar('Server javob berdi, lekin holat o\'zgarmadi (p_id='+shId+'). ep_msh_tasdiq qaysi id ni kutayotganini tekshiring.','xato');
    else xabar(ok?'Tasdiqlandi':'Rad etildi','ok');
  }catch(e){ xabar(xatoMatn(e),'xato'); }
}

ishga();
</script>
