<style>
:root{--paper:#E8E7E1;--panel:#FBFAF6;--ink:#131A16;--mu:#6B7169;--line:#D3D3C8;
  --st:#0E6E5C;--cr:#7A3CC4;--warn:#C2571F;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:"Onest",-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.disp{font-family:"Unbounded",sans-serif;letter-spacing:-.02em;line-height:1.15}
.mono{font-family:"JetBrains Mono",monospace}
.app{display:flex;flex-direction:column;min-height:100dvh}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:"Unbounded";font-weight:800;font-size:13px}
.brand span{color:var(--st)}
.lang{display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:7px 13px;font:700 12px "JetBrains Mono";color:var(--ink);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--panel)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.meta{display:flex;justify-content:space-between;font:700 11px "JetBrains Mono";color:var(--mu);margin-top:7px}
.tw{display:flex;align-items:center;gap:10px;margin-top:9px}
.tbar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--st);width:100%;transition:width 1s linear}
.tnum{font:700 15px "JetBrains Mono";min-width:44px;text-align:right}
.hot{color:var(--warn)!important}.hot i{background:var(--warn)!important}

main{flex:1;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-family:"Unbounded";font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.2}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:700}
.lead{color:var(--mu);font-size:15px;margin:10px 0 20px}
.rules{border-left:2px solid var(--st);padding-left:14px;margin-bottom:22px}
.rules li{list-style:none;font-size:14px;margin-bottom:9px}
.rules li::before{content:"—";color:var(--st);margin-right:7px}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin-bottom:6px;
  letter-spacing:.4px;text-transform:uppercase}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:14px;font-size:16px;font-family:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--st);outline-offset:-1px}
textarea{min-height:190px;resize:vertical;line-height:1.6}
.field{margin-bottom:14px}
.btn{width:100%;background:var(--ink);color:var(--panel);border:0;border-radius:var(--r);
  padding:17px;font:600 16px "Onest";cursor:pointer;font-family:inherit}
.btn:active{background:var(--st)}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

.qb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.qt{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:20px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;
  display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;min-height:58px;cursor:pointer}
.opt:active{border-color:var(--ink);background:#F4F2ED}
.opt b{font:700 12px "JetBrains Mono";color:var(--mu);padding-top:3px;flex:none}
.hint{font-size:13px;color:var(--mu);margin:12px 0 16px}

/* PIN */
.pin-in{font:700 30px "JetBrains Mono";text-align:center;letter-spacing:.32em;padding:18px 14px}
.err{color:var(--warn);font-size:14px;margin-top:12px;min-height:20px}
.ok-mark{width:56px;height:56px;border-radius:50%;background:var(--st);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
</style>
</head>

{id:"P5",b:"pd",
q:["Дисциплина: класс шумит на каждом уроке.","Intizom: sinf har darsda shovqin qiladi."],
o:[["Ужесточаю наказания и вызываю родителей.","Jazoni kuchaytiraman va ota-onalarni chaqiraman.",1],
   ["Сначала проверяю себя: темп урока, смена деятельности каждые 10–15 минут, понятные правила с первого дня.","Avval o'zimni tekshiraman: dars temp'i, har 10–15 daqiqada faoliyat almashishi, birinchi kundan aniq qoidalar.",3],
   ["Нахожу «зачинщиков» и рассаживаю их.","«Boshlovchi»larni topib, alohida o'tqazaman.",2],
   ["Терплю, главное — пройти программу.","Chidayman, asosiysi — dasturni o'tish.",0]]},

{id:"P6",b:"pd",
q:["Вам дали новый предмет или направление, которое вы не вели.","Sizga o'zingiz olib bormagan yangi fan yoki yo'nalish berildi."],
o:[["Отказываюсь — это не моя специализация.","Rad etaman — bu mening yo'nalishim emas.",0],
   ["Беру: за две недели разбираю программу, нахожу источники и коллегу-наставника, честно предупреждаю, что первый месяц догоняю.","Olaman: 2 haftada dasturni o'rganaman, manba va murabbiy-hamkasb topaman, birinchi oy quvib yetishimni ochiq aytaman.",3],
   ["Беру и иду по учебнику шаг за шагом вместе с детьми.","Olaman va darslik bo'yicha, bolalar bilan birga qadam-baqadam boraman.",2],
   ["Беру, но веду по старым материалам своего предмета.","Olaman, lekin o'z fanimning eski materiallari bilan olib boraman.",1]]},

{id:"P7",b:"pd",
q:["Ежедневные тесты показали: у половины класса результат упал.","Kundalik testlar ko'rsatdi: sinfning yarmida natija tushib ketdi."],
o:[["Считаю, что дети стали меньше стараться.","Bolalar tirishmay qo'yibdi deb hisoblayman.",0],
   ["Разбираю, какие именно вопросы завалили, и возвращаюсь к этой части темы.","Aynan qaysi savollarni yiqitganini tahlil qilaman va mavzuning o'sha qismiga qaytaman.",3],
   ["Провожу тест повторно — возможно, дело в самом тесте.","Testni qayta o'tkazaman — balki muammo testning o'zida.",2],
   ["Задаю больше домашних заданий.","Ko'proq uy vazifasi beraman.",1]]},

/* ---------- КОММУНИКАЦИЯ / KOMMUNIKATSIYA ---------- */
{id:"C1",b:"cm",
q:["Родитель публично написал жалобу в общий чат школы.","Ota-ona maktabning umumiy chatiga ochiq shikoyat yozdi."],
o:[["Отвечаю в чате подробно и доказываю, что он неправ.","Chatda batafsil javob beraman va uning noto'g'riligini isbotlayman.",0],
   ["В чате коротко: «вижу, свяжусь с вами лично», дальше — личный звонок или встреча плюс информирую администрацию.","Chatda qisqa: «ko'rdim, siz bilan shaxsan bog'lanaman», keyin — shaxsiy qo'ng'iroq yoki uchrashuv va ma'muriyatni xabardor qilaman.",3],
   ["В чате молчу, но сразу иду к администрации и вместе готовим ответ.","Chatda indamayman, lekin darhol ma'muriyatga boraman va javobni birga tayyorlaymiz.",2],
   ["Пишу ему в личку эмоциональное объяснение.","Unga shaxsiyga hissiyotli tushuntirish yozaman.",1]]},

{id:"C2",b:"cm",
q:["Родитель требует ставить его ребёнку оценки выше.","Ota-ona farzandiga baholarni yuqoriroq qo'yishni talab qilyapti."],
o:[["Иду навстречу, чтобы не было конфликта.","Nizo bo'lmasin deb yon beraman.",0],
   ["Отказываю: объясняю критерии оценки, показываю работы ребёнка и даю реальный план, как поднять балл.","Rad etaman: baho mezonlarini tushuntiraman, bolaning ishlarini ko'rsataman va ballni ko'tarishning real rejasini beraman.",3],
   ["Отказываю коротко: «есть правила школы».","Qisqa rad etaman: «maktab qoidalari shunday».",2],
   ["Перевожу вопрос на директора.","Masalani direktorga o'tkazaman.",1]]},

{id:"C3",b:"cm",
q:["Коллега при вас плохо отзывается о другом учителе.","Hamkasbingiz sizning oldingizda boshqa o'qituvchi haqida yomon gapiryapti."],
o:[["Поддерживаю разговор.","Suhbatni qo'llab-quvvatlayman.",0],
   ["Не участвую и меняю тему; если проблема реальная — предлагаю сказать это ему самому или администрации.","Qatnashmayman va mavzuni o'zgartiraman; muammo real bo'lsa — buni o'sha odamning o'ziga yoki ma'muriyatga aytishni taklif qilaman.",3],
   ["Молчу и слушаю до конца.","Indamay, oxirigacha tinglayman.",1],
   ["Молча выхожу из разговора.","Indamay suhbatdan chiqib ketaman.",2]]},

{id:"C4",b:"cm",
q:["Нужно сообщить родителю плохую новость о ребёнке.","Ota-onaga bolasi haqida yomon xabarni yetkazish kerak."],
o:[["Говорю прямо и по фактам, без предисловий.","To'g'ridan-to'g'ri, faktlar bilan, kirish so'zlarsiz aytaman.",2],
   ["Сначала факты и сильные стороны ребёнка, потом конкретная проблема, потом конкретный план на две недели.","Avval faktlar va bolaning kuchli tomonlari, keyin aniq muammo, keyin 2 haftalik aniq reja.",3],
   ["Смягчаю так, что родитель не понимает серьёзности.","Shunchalik yumshataman-ki, ota-ona jiddiyligini tushunmay qoladi.",0],
   ["Пишу подробное сообщение в мессенджере.","Messenjerga batafsil xabar yozaman.",1]]},

{id:"C5",b:"cm",
q:["Новый учитель в вашей команде явно не справляется.","Jamoangizdagi yangi o'qituvchi ochiq-oydin uddalay olmayapti."],
o:[["Не лезу, это дело администрации.","Aralashmayman, bu ma'muriyatning ishi.",1],
   ["Предлагаю ему прийти на мой урок и вместе с ним разбираю его урок.","Darsimga kelishni taklif qilaman va uning darsini u bilan birga tahlil qilaman.",3],
   ["Обсуждаю с другими коллегами.","Boshqa hamkasblar bilan muhokama qilaman.",0],
   ["Говорю администрации, что новичку нужна поддержка.","Ma'muriyatga aytaman: yangi odamga qo'llab-quvvatlash kerak.",2]]},

    ["Зона развития — только с наставником и планом","Rivojlanish zonasi — faqat murabbiy va reja bilan"],
    ["Сильный кандидат","Kuchli nomzod"],
    ["Высокий потенциал — брать и растить в наставника","Yuqori potensial — olib, murabbiy qilib o'stirish kerak"]]
,
 pinlead:["Введите PIN-код, который вам прислала школа.","Maktab yuborgan PIN kodni kiriting."],
 pinlab:["PIN-код","PIN kod"],
 enter:["Войти","Kirish"],
 checking:["Проверяем…","Tekshirilmoqda…"],
 pinbad:["PIN не найден. Проверьте код или попросите новый.","PIN topilmadi. Kodni tekshiring yoki yangisini soʻrang."],
 pinused:["По этому PIN тест уже пройден. Попросите новый код.","Bu PIN boʻyicha test allaqachon topshirilgan. Yangi kod soʻrang."],
 neterr:["Нет связи. Проверьте интернет и попробуйте снова.","Aloqa yoʻq. Internetni tekshirib, qayta urining."]
};

const W={st:.25,cr:.25,pd:.18,cm:.12,gr:.08,mt:.07,dg:.05};
const MAXP={st:24,cr:26,pd:21,cm:15,gr:12,mt:12,dg:9};
let L=0,i=0,ans={},openA={},timeouts=0,tid=null,cand={},pin="",inv={},started=false;
const $=s=>document.getElementById(s),app=$("app"),t=k=>T[k][L];

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function setLang(l){L=(l==="uz")?1:0;$("lru").className=L?"":"on";$("luz").className=L?"on":"";
  document.documentElement.lang=L?"uz":"ru";render();}

/* ═══ 1. PIN ═══ */
function pinScreen(){
  $("hbar").innerHTML="";
  app.innerHTML=`<div class="eye">EduNova School</div>
   <h1 style="margin:8px 0 6px">${t("title")}</h1>
   <p class="lead">${t("pinlead")}</p>
   <div class="field"><label>${t("pinlab")}</label>
     <input id="pin" class="pin-in" inputmode="numeric" pattern="[0-9]*" maxlength="6"
       autocomplete="one-time-code" placeholder="000000" oninput="pinTyped()"></div>
   <button class="btn" id="pinbtn" onclick="pinGo()" disabled>${t("enter")}</button>
   <div class="err" id="pinerr"></div>`;
  $("pin").focus();
}
function pinTyped(){
  const v=$("pin").value.replace(/\D/g,"").slice(0,6);
  $("pin").value=v;$("pinbtn").disabled=v.length!==6;$("pinerr").textContent="";
  if(v.length===6)pinGo();
}
async function pinGo(){
  const v=$("pin").value.trim(),e=$("pinerr"),b=$("pinbtn");
  if(v.length!==6)return;
  b.disabled=true;e.textContent=t("checking");
  try{
    const d=await rpc("hr_pin_tekshir",{p_pin:v});
    if(!d||!d.ok){e.textContent=d&&d.xato==="PIN_ISHLATILGAN"?t("pinused"):t("pinbad");b.disabled=false;return;}
    pin=v;inv=d;e.textContent="";intro();
  }catch(err){e.textContent=t("neterr");b.disabled=false;}
}

/* ═══ 2. ANKETA ═══ */
function intro(){
  $("hbar").innerHTML="";
  app.innerHTML=`<div class="eye">EduNova School · HR</div>
   <h1 style="margin:8px 0 6px">${t("title")}</h1>
   <p class="lead">${t("sub")}</p>
   <ul class="rules"><li>${t("r1")}</li><li>${t("r2")}</li><li>${t("r3")}</li><li>${t("r4")}</li></ul>
   <div class="field"><label>${t("fio")}</label><input id="f1" value="${(inv.fio||"").replace(/"/g,"&quot;")}"></div>
   <div class="field"><label>${t("subj")}</label><input id="f2" value="${(inv.fan||"").replace(/"/g,"&quot;")}"></div>
   <div class="field"><label>${t("exp")}</label><select id="f3">${T.exps[L].map(x=>`<option>${x}</option>`).join("")}</select></div>
   <div class="field" style="margin-bottom:20px"><label>${t("track")}</label><select id="f4">${T.tracks[L].map(x=>`<option>${x}</option>`).join("")}</select></div>
   <button class="btn" onclick="begin()">${t("start")} →</button>`;
}
function begin(){
  if(!$("f1").value.trim()){$("f1").focus();return;}
  cand={fio:$("f1").value.trim(),subj:$("f2").value.trim(),exp:$("f3").value,track:$("f4").value};
  Q.forEach(q=>{if(q.o)q.sh=[...q.o].sort(()=>Math.random()-.5);});
  started=true;i=0;
  window.onbeforeunload=()=>"";
  render();
}

/* ═══ 3. SAVOLLAR ═══ */
function render(){
  if(!pin){pinScreen();return;}
  if(!started){intro();return;}
  if(i>=Q.length){finish();return;}
  clearInterval(tid);
  const q=Q[i],pc=Math.round(i/Q.length*100);
  $("hbar").innerHTML=`<div class="prog"><i style="width:${pc}%"></i></div>
    <div class="meta"><span>${i+1} / ${Q.length}</span><span>${T.blocks[q.b][L]}</span></div>
    ${q.t?`<div class="tw"><div class="tbar" id="tb"><i id="tf"></i></div><div class="tnum" id="tn">${q.t}s</div></div>`:""}`;
  let body="";
  if(q.open){
    body=`<textarea id="ta" placeholder="1.&#10;2.&#10;3."></textarea>
      <div class="hint">${t("openhint")}</div>
      <button class="btn" onclick="saveOpen()">${t("next")} →</button>`;
  }else if(q.b==="sc"){
    body=`<div class="opt" onclick="pick(1)"><b>A</b><span>${t("yes")}</span></div>
          <div class="opt" onclick="pick(0)"><b>B</b><span>${t("no")}</span></div>`;
  }else{
    body=q.sh.map((o,n)=>`<div class="opt" onclick="pick(${o[2]})"><b>${"ABCD"[n]}</b><span>${o[L]}</span></div>`).join("");
  }
  app.innerHTML=`<div class="qb" style="color:var(--${q.b==="cr"?"cr":"st"})">${T.blocks[q.b][L]}</div>
    <div class="qt">${q.q[L]}</div>${body}`;
  window.scrollTo(0,0);
  if(q.t)timer(q.t);
}
function timer(sec){
  let left=sec;const f=$("tf"),n=$("tn"),b=$("tb");
  tid=setInterval(()=>{left--;f.style.width=(left/sec*100)+"%";n.textContent=left+"s";
    if(left<=10){b.classList.add("hot");n.classList.add("hot");}
    if(left<=0){clearInterval(tid);timeouts++;ans[Q[i].id]=0;i++;render();}},1000);
}
function pick(p){clearInterval(tid);ans[Q[i].id]=p;i++;render();}
function saveOpen(){
  const v=$("ta").value.trim();openA[Q[i].id]=v;
  if(Q[i].open==="flu"){
    const n=v.split(/\n|;/).map(s=>s.trim()).filter(s=>s.length>2).length;
    ans[Q[i].id]=n>=6?4:n>=4?3:n>=2?2:n>=1?1:0;
  }
  i++;render();
}

/* ═══ 4. NATIJA ═══ */
function calc(){
  const raw={st:0,cr:0,pd:0,cm:0,gr:0,mt:0,dg:0};
  Q.forEach(q=>{if(q.b!=="sc"&&ans[q.id]!==undefined)raw[q.b]+=ans[q.id];});
  const pct={};Object.keys(raw).forEach(k=>pct[k]=Math.min(100,Math.round(raw[k]/MAXP[k]*100)));
  let tot=0;Object.keys(W).forEach(k=>tot+=pct[k]*W[k]);
  const lie=["I1","I2","I3","I4","I5"].reduce((s,k)=>s+(ans[k]||0),0);
  return{pct,total:Math.round(tot),lie,speed:Math.round((8-timeouts)/8*100)};
}
function quad(cr,st){const h=c=>c>=65;
  return h(st)&&h(cr)?"Innovator-yadro":h(st)?"Ishonchli tayanch":h(cr)?"Nozik ijodkor":"Xavf zonasi";}

async function finish(){
  clearInterval(tid);started=false;window.onbeforeunload=null;
  $("hbar").innerHTML="";
  app.innerHTML=`<div class="ok-mark">✓</div>
    <h1>${t("done")}</h1><p class="lead">${t("donetxt")}</p>
    <div class="mono" id="sv" style="font-size:13px;color:var(--mu)">${t("svWait")}</div>`;
  const s=calc();
  const payload={fio:cand.fio,fan:cand.subj,staj:cand.exp,til:cand.track,
    umumiy:s.total,ballar:s.pct,kvadrant:quad(s.pct.cr,s.pct.st),
    samimiylik:s.lie,tezlik:s.speed,javoblar:ans,ochiq:openA};
  const e=$("sv");
  for(let k=0;k<3;k++){
    try{
      const d=await rpc("hr_natija_saqlash",{p_pin:pin,p_data:payload});
      if(d&&d.ok){e.style.color="var(--st)";e.textContent="✓ "+t("svOk");return;}
      throw new Error(d&&d.xato||"err");
    }catch(err){ if(k<2) await new Promise(r=>setTimeout(r,1500)); }
  }
  e.style.color="var(--warn)";
  e.innerHTML=t("svErr")+`<button class="btn g" style="margin-top:14px" onclick="dl()">${t("save")}</button>`;
  window._last=payload;
}
function dl(){
  const b=new Blob([JSON.stringify(window._last,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="hr_"+(cand.fio||"nomzod").replace(/\s+/g,"_")+".json";a.click();
}
setLang("ru");
</script>
</body>
</html>
