<html lang="uz">
<head>
<meta charset="UTF-8">

<title>EduNova — Test Kabineti</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6B1A; --orange-d:#E85400;
  --steel:#1C1C1C; --navy:#1A2238;
  --concrete:#E7E1D3; --cream:#FAF6EC; --card:#FFFFFF;
  --line:#CFC7B6; --mut:#6B6558; --ok:#1E8E4E; --bad:#C0392B;
  --fm:'Oswald',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rubik',sans-serif;background:var(--concrete);color:var(--steel);min-height:100vh;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,107,26,.06),transparent 40%),radial-gradient(circle at 90% 90%,rgba(26,34,56,.06),transparent 40%);}
.hazard{height:7px;background:repeating-linear-gradient(-45deg,var(--orange) 0 14px,var(--steel) 14px 28px)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 20px}
.logo{font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:.5px}
.logo span{color:var(--orange)}
.logo small{display:block;font-family:var(--fm);font-weight:500;font-size:9px;letter-spacing:3px;color:var(--mut)}
.lang-sw{display:flex;gap:6px}
.lang-sw button{font-family:var(--fm);font-weight:600;font-size:12px;letter-spacing:1px;padding:7px 12px;border:2px solid var(--steel);background:transparent;color:var(--steel);cursor:pointer;border-radius:8px}
.lang-sw button.on{background:var(--steel);color:#fff}

.screen{display:none;flex:1;flex-direction:column;justify-content:center;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* CODE ENTRY */
.card{background:var(--card);border-radius:22px;padding:36px 28px;box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04)}
.big-title{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,6vw,36px);text-transform:uppercase;text-align:center;line-height:1.1;margin-bottom:10px}
.subtitle{text-align:center;color:var(--mut);font-size:15px;margin-bottom:28px}
.code-in{width:100%;font-family:var(--fm);font-weight:700;font-size:38px;letter-spacing:14px;text-align:center;padding:20px;border:3px solid var(--line);border-radius:16px;color:var(--steel);background:var(--cream);outline:none;transition:.2s}
.code-in:focus{border-color:var(--orange)}
.code-in::placeholder{letter-spacing:8px;color:#bbb;font-size:24px}
.btn{width:100%;font-family:var(--fm);font-weight:700;font-size:18px;letter-spacing:1px;text-transform:uppercase;padding:18px;border:none;border-radius:16px;background:var(--orange);color:#fff;cursor:pointer;margin-top:18px;transition:.2s;box-shadow:0 6px 18px rgba(255,107,26,.3)}
.btn:hover{background:var(--orange-d)}
.btn:disabled{opacity:.5;cursor:default}
.btn-sec{background:var(--navy);box-shadow:0 6px 18px rgba(26,34,56,.25)}
.err{color:var(--bad);text-align:center;font-size:14px;margin-top:14px;font-weight:600;display:none}

/* SUBJECT PICK */
.hello{text-align:center;margin-bottom:8px}
.hello .nm{font-family:'Archivo Black',sans-serif;font-size:28px;color:var(--steel)}
.hello .gr{color:var(--mut);font-size:14px;font-family:var(--fm);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.subj-grid{display:grid;gap:14px;margin-top:24px}
.subj{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid transparent;border-radius:18px;padding:20px 22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:.2s}
.subj:hover{border-color:var(--orange);transform:translateX(4px)}
.subj .ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.subj .tx b{font-size:19px;display:block}
.subj .tx span{font-size:13px;color:var(--mut)}
.subj .arrow{margin-left:auto;color:var(--orange);font-size:22px;font-weight:700}

/* TEST */
.prog-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.prog-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .3s;width:0}
.q-count{font-family:var(--fm);font-weight:600;font-size:13px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin-bottom:10px;text-align:center}
.q-text{font-size:22px;font-weight:600;text-align:center;margin-bottom:26px;line-height:1.35;min-height:60px}
.opts{display:grid;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 20px;font-size:16px;cursor:pointer;transition:.15s;text-align:left}
.opt:hover{border-color:var(--orange);background:var(--cream)}
.opt.correct{border-color:var(--ok);background:#e8f6ee}
.opt.wrong{border-color:var(--bad);background:#fbeceb}
.opt.disabled{pointer-events:none;opacity:.85}

/* RESULT */
.res-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.res-circle .pc{font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1}
.res-circle .lbl{font-family:var(--fm);font-size:12px;letter-spacing:1px;margin-top:2px}
.res-msg{text-align:center;font-size:20px;font-weight:600;margin-bottom:8px}
.res-sub{text-align:center;color:var(--mut);font-size:15px;margin-bottom:26px}
.spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hazard"></div>
<div class="wrap">
  <div class="topbar">
    <div class="logo">EDU<span>NOVA</span><small>TEST KABINETI</small></div>
    <div class="lang-sw">
      <button id="lng-uz" class="on" onclick="setLang('uz')">O'ZB</button>
      <button id="lng-ru" onclick="setLang('ru')">РУС</button>
    </div>
  </div>

  <!-- SCREEN 1: CODE -->
  <div class="screen on" id="sc-code">
    <div class="card">
      <div class="big-title" data-uz="Test kabineti" data-ru="Тест-кабинет">Test kabineti</div>
      <div class="subtitle" data-uz="Kodingizni kiriting" data-ru="Введите свой код">Kodingizni kiriting</div>
      <input class="code-in" id="code-input" type="tel" maxlength="6" placeholder="0000" autocomplete="off" inputmode="numeric">
      <button class="btn" id="code-btn" onclick="checkCode()" data-uz="Kirish" data-ru="Войти">Kirish</button>
      <div class="err" id="code-err"></div>

  <!-- SCREEN 2: SUBJECT -->
  <div class="screen" id="sc-subj">

      <div class="gr" id="stu-gr">—</div>
    </div>
    <div class="subtitle" data-uz="Fanni tanlang" data-ru="Выберите предмет">Fanni tanlang</div>
    <div class="subj-grid" id="subj-grid"></div>
    <button class="btn btn-sec" onclick="logout()" style="margin-top:22px" data-uz="Chiqish" data-ru="Выход">Chiqish</button>

  <!-- SCREEN 3: TEST -->
  <div class="screen" id="sc-test">

    <div class="q-text" id="q-text">—</div>

      <div class="res-sub" id="res-sub">—</div>
      <div id="save-state"></div>
      <button class="btn" onclick="logout()" data-uz="Tayyor — Chiqish" data-ru="Готово — Выход">Tayyor — Chiqish</button>
    </div>
  </div>
</div>

function tr(o){return o[LANG];}

function setLang(l){
  LANG=l;
  document.getElementById('lng-uz').classList.toggle('on',l==='uz');
  document.getElementById('lng-ru').classList.toggle('on',l==='ru');
  document.querySelectorAll('[data-uz]').forEach(el=>{el.textContent=el.getAttribute('data-'+l);});
  // qayta render kerak bo'lsa
  if(document.getElementById('sc-subj').classList.contains('on')) renderSubjects();
  if(document.getElementById('sc-test').classList.contains('on')) renderQuestion();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ======= CODE CHECK =======
async function checkCode(){
  const code=document.getElementById('code-input').value.trim();
  const err=document.getElementById('code-err');
  const btn=document.getElementById('code-btn');
  err.style.display='none';
  if(!code){err.textContent=tr(T.emptyCode);err.style.display='block';return;}
  btn.disabled=true;btn.textContent='...';
  try{
    const{data,error}=await sb.from('students').select('id,full_name,grade,access_code').eq('access_code',code).maybeSingle();
    if(error||!data){err.textContent=tr(T.wrongCode);err.style.display='block';btn.disabled=false;setBtnLabel();return;}
    student=data;
    document.getElementById('stu-nm').textContent=data.full_name||'—';
    document.getElementById('stu-gr').textContent=(data.grade!=null?data.grade:'?')+tr(T.grade);
    renderSubjects();
    show('sc-subj');
  }catch(e){
    err.textContent=tr(T.wrongCode);err.style.display='block';
  }
  btn.disabled=false;setBtnLabel();
}
function setBtnLabel(){document.getElementById('code-btn').textContent=document.getElementById('code-btn').getAttribute('data-'+LANG);}

// ======= SUBJECTS =======
function renderSubjects(){
  const grid=document.getElementById('subj-grid');
  grid.innerHTML=SUBJECTS.map(s=>
    '<div class="subj" onclick="startTest(\''+s.key+'\')">'
    +'<div class="ic" style="background:'+s.bg+'22">'+s.ic+'</div>'
    +'<div class="tx"><b>'+(LANG==='uz'?s.uz:s.ru)+'</b><span>'+(LANG==='uz'?s.d_uz:s.d_ru)+'</span></div>'
    +'<div class="arrow">→</div>'
    +'</div>'
  ).join('');
}

// ======= TEST =======
function startTest(subjKey){
  curSubject=subjKey;
  const grade=student.grade;
  const bank=(TESTS[subjKey]||{})[grade];
  if(!bank||!bank.length){
    alert(tr(T.noTest));
    return;
  }
  curQuestions=bank;
  qIdx=0;correct=0;
  show('sc-test');
  renderQuestion();
}

function renderQuestion(){
  const q=curQuestions[qIdx];
  document.getElementById('q-count').textContent=(qIdx+1)+' / '+curQuestions.length;
  document.getElementById('prog-fill').style.width=((qIdx)/curQuestions.length*100)+'%';
  document.getElementById('q-text').textContent=LANG==='uz'?q.q_uz:q.q_ru;
  const opts=LANG==='uz'?q.opts_uz:q.opts_ru;
  const box=document.getElementById('opts');
  box.innerHTML=opts.map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+o+'</button>').join('');
}

function answer(i){
  const q=curQuestions[qIdx];
  const btns=document.querySelectorAll('#opts .opt');
  btns.forEach(b=>b.classList.add('disabled'));
  if(i===q.c){correct++;btns[i].classList.add('correct');}
  else{btns[i].classList.add('wrong');btns[q.c].classList.add('correct');}
  document.getElementById('prog-fill').style.width=((qIdx+1)/curQuestions.length*100)+'%';
  setTimeout(()=>{
    qIdx++;
    if(qIdx<curQuestions.length) renderQuestion();
    else finishTest();
  },900);
}

async function finishTest(){
  const total=curQuestions.length;
  const pc=Math.round(correct/total*100);
  // result screen
  const circle=document.getElementById('res-circle');
  const col= pc>=70?'#1E8E4E' : pc>=40?'#C98A1B' : '#C0392B';
  circle.style.background=col;
  document.getElementById('res-pc').textContent=pc+'%';
  document.getElementById('res-msg').textContent= pc>=70?tr(T.resGood):pc>=40?tr(T.resOk):tr(T.resLow);
  document.getElementById('res-sub').textContent=correct+' / '+total+' '+tr(T.correctW);
  const ss=document.getElementById('save-state');
  ss.innerHTML='<div class="q-count" style="margin:10px 0">'+tr(T.saving)+'</div>';
  show('sc-result');

  // SAVE to DB
  try{
    const{error}=await sb.from('test_results').insert({
      student_id:student.id,
      student_name:student.full_name,
      subject:curSubject,
      grade:student.grade,
      score:correct,
      total:total,
      percent:pc,
      created_at:new Date().toISOString()
    });
    if(error) throw error;
    ss.innerHTML='<div class="q-count" style="margin:10px 0;color:#1E8E4E">'+tr(T.saved)+'</div>';
  }catch(e){
    ss.innerHTML='<div class="q-count" style="margin:10px 0;color:#C0392B">'+tr(T.saveErr)+'</div>';
    console.error('save error',e);
  }
}

function logout(){
  student=null;curSubject=null;curQuestions=[];qIdx=0;correct=0;
  document.getElementById('code-input').value='';
  document.getElementById('code-err').style.display='none';
  show('sc-code');
  setTimeout(()=>document.getElementById('code-input').focus(),100);
}

// Enter tugmasi
document.getElementById('code-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkCode();});
document.getElementById('code-input').focus();
</script>
