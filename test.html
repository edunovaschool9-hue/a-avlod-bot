<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EduNova — Test</title><meta name="theme-color" content="#F6F1E6">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F6F1E6;color:#1A2238;font-size:16px}
.wrap{max-width:620px;margin:0 auto;padding:14px 12px 90px}
.top{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.logo{font-weight:800;font-size:17px}.out{margin-left:auto;font-size:13px;color:#8b8271;text-decoration:underline}
h1{font-size:19px;margin:0 0 10px}
.card{background:#fff;border:1px solid #e6dcc8;border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px;border:1px solid #d9cfba;border-radius:10px;font-size:17px;background:#fff;color:#1A2238}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#FF7A00;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
.btn.sec{background:#fff;color:#1A2238;border:1px solid #d9cfba}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{background:#fff;border:1px solid #e0d5bf;border-radius:12px;padding:14px 6px;text-align:center;font-weight:800;font-size:17px}
.cls small{display:block;font-weight:600;color:#8b8271;font-size:11px;margin-top:3px}
.row{background:#fff;border:1px solid #e6dcc8;border-radius:12px;padding:14px 12px;margin-bottom:8px;font-size:17px;font-weight:600}
.fan{display:flex;justify-content:space-between;align-items:center}
.fan .n{font-size:12px;color:#8b8271;font-weight:600}
.fan.yoq{opacity:.45}
.q{background:#fff;border:1px solid #e6dcc8;border-radius:14px;padding:16px;margin-bottom:12px}
.qn{font-size:12px;color:#8b8271;font-weight:700;margin-bottom:6px}
.qt{font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.35}
.v{display:block;width:100%;text-align:left;padding:14px;border:2px solid #e6dcc8;border-radius:11px;background:#fff;font-size:17px;margin-bottom:8px;font-weight:600}
.v.on{border-color:#FF7A00;background:#fff7ed}
.bar{position:fixed;left:0;right:0;bottom:0;background:#F6F1E6;border-top:1px solid #e0d5bf;padding:10px 12px;display:flex;gap:8px;max-width:620px;margin:0 auto}
.bar button{flex:1;padding:14px;border:0;border-radius:11px;font-weight:700;font-size:15px}
.bar .go{background:#FF7A00;color:#fff}.bar .back{background:#fff;border:1px solid #d9cfba;color:#1A2238}
.mu{color:#8b8271}.sm{font-size:13px}.center{text-align:center}.err{color:#b91c1c;font-size:14px;min-height:18px}
.ball{font-size:56px;font-weight:800;text-align:center;margin:10px 0}
.ok{color:#15803d}.bad{color:#b91c1c}
.res{background:#fff;border:1px solid #e6dcc8;border-radius:12px;padding:12px;margin-bottom:8px}
.res .t{font-weight:700;margin-bottom:4px}
.res .g{font-size:14px}
</style></head><body><div class="wrap">
<div class="top"><span class="logo">EduNova · Test</span><a class="out" href="#" onclick="chiq();return false;">Chiqish</a></div>
<div id="app"></div></div><div id="bar"></div>
<script>
var SB='https://unaodltahuevrfnarfha.supabase.co', KEY='sb_publishable_i705NKn0jH1yGmIZJGAdgQ_wyzlcrZP';
var TOK=sessionStorage.getItem('test_tok')||localStorage.getItem('ep_token_oqituvchi')||'';
var SINF=null, BOLA=null, T=null, JAV={}, IDX=0;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rpc(fn,a){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(a||{})}).then(function(r){return r.json();});}
function chiq(){sessionStorage.removeItem('test_tok');TOK='';$('bar').innerHTML='';kirish();}
function kirish(){
 $('bar').innerHTML='';
 $('app').innerHTML='<h1>Kirish</h1><div class="card"><label class="sm mu">PIN kod</label>'+
  '<input id="pin" type="password" inputmode="numeric"><div class="err" id="e"></div>'+
  '<button class="btn" onclick="kir()">Kirish</button></div>';
 var p=$('pin'); if(p){p.focus();p.addEventListener('keydown',function(ev){if(ev.key==='Enter')kir();});}
}
function kir(){
 var v=($('pin').value||'').trim(); if(!v)return; $('e').textContent='';
 rpc('ep_kirish',{p_pin:v}).then(function(d){
  if(!d||!d.token){$('e').textContent='PIN noto\u2018g\u2018ri';return;}
  if(d.rol!=='oqituvchi'&&d.rol!=='admin'){$('e').textContent='Ruxsat yo\u2018q';return;}
  TOK=d.token; sessionStorage.setItem('test_tok',TOK); sinflar();
 })["catch"](function(){$('e').textContent='Xatolik';});
}
function sinflar(){
 SINF=null;BOLA=null;T=null;$('bar').innerHTML='';
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_sinflar',{p_token:TOK,p_kun:null}).then(function(d){
  if(!d||!d.ok){chiq();return;}
  var h='<h1>Sinfni tanlang</h1><div class="grid">';
  d.sinflar.forEach(function(s){ h+='<button class="cls" onclick="oquvchilar('+s.id+',\''+esc(s.nom)+'\')">'+esc(s.nom)+'<small>'+s.jami+' o\u2018quvchi</small></button>'; });
  $('app').innerHTML=h+'</div>';
 })["catch"](function(){$('app').innerHTML='<p class="mu">Xatolik</p>';});
}
function oquvchilar(id,nom){
 SINF={id:id,nom:nom};
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_royxat',{p_token:TOK,p_sinf_id:id,p_kun:null}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');sinflar();return;}
  var h='<h1>'+esc(nom)+' \u2014 o\u2018quvchi</h1>';
  (d.royxat||[]).forEach(function(o){ h+='<div class="row" onclick="fanlar('+o.id+',\''+esc(o.ism).replace(/'/g,"\\'")+'\')">'+esc(o.ism)+'</div>'; });
  if(!(d.royxat||[]).length)h+='<p class="mu center">Bu sinfda o\u2018quvchi yo\u2018q</p>';
  $('app').innerHTML=h;
  $('bar').innerHTML='<div class="bar"><button class="back" onclick="sinflar()">\u2039 Sinflar</button>'+
    '<button class="go" onclick="qosh()">+ O\u2018quvchi qo\u2018shish</button></div>';
 });
}
function qosh(){
 var ism=prompt(SINF.nom+' \u2014 yangi o\u2018quvchining ism va familiyasi:');
 if(!ism||ism.trim().length<4)return;
 rpc('ep_dav_qol',{p_token:TOK,p_sinf_id:SINF.id,p_ism:ism.trim()}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');return;}
  oquvchilar(SINF.id,SINF.nom);
 })["catch"](function(){alert('Xatolik');});
}
function fanlar(oid,ism){
 BOLA={id:oid,ism:ism};
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 var daraja=parseInt(SINF.nom,10);
 rpc('ep_test_fanlar',{p_token:TOK,p_daraja:daraja}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');return;}
  var h='<h1>'+esc(ism)+'</h1><p class="sm mu">'+esc(SINF.nom)+' \u00b7 fanni tanlang. Har kuni savollar yangilanadi.</p>';
  (d.royxat||[]).forEach(function(f){
   var bor=f.savol>=5;
   h+='<div class="row fan'+(bor?'':' yoq')+'"'+(bor?' onclick="boshla('+f.id+')"':'')+'>'+
      '<span>'+esc(f.nom)+'</span><span class="n">'+(bor?(f.savol+' savol'):'savol yo\u2018q')+'</span></div>';
  });
  $('app').innerHTML=h;
  $('bar').innerHTML='<div class="bar"><button class="back" onclick="oquvchilar('+SINF.id+',\''+esc(SINF.nom)+'\')">\u2039 Orqaga</button></div>';
 });
}
function boshla(fid){
 $('app').innerHTML='<p class="mu">Test tayyorlanmoqda\u2026</p>';
 rpc('ep_test_boshla',{p_token:TOK,p_oquvchi_id:BOLA.id,p_fan_id:fid}).then(function(d){
  if(!d||!d.ok){alert(d&&d.xato==='savol_kam'?'Bu fan uchun savollar yetarli emas':'Xatolik');fanlar(BOLA.id,BOLA.ism);return;}
  T=d; JAV={}; IDX=0; savol();
 });
}
function savol(){
 var q=T.savollar[IDX];
 var h='<div class="qn">'+esc(T.oquvchi)+' \u00b7 '+esc(T.fan)+' \u00b7 savol '+(IDX+1)+'/'+T.savollar.length+'</div>'+
   '<div class="q"><div class="qt">'+esc(q.savol)+'</div>';
 ['a','b','c','d'].forEach(function(k){
  h+='<button class="v'+(JAV[q.id]===k?' on':'')+'" onclick="tanla(\''+k+'\')">'+k.toUpperCase()+') '+esc(q[k])+'</button>';
 });
 $('app').innerHTML=h+'</div>';
 $('bar').innerHTML='<div class="bar">'+
  (IDX>0?'<button class="back" onclick="IDX--;savol()">\u2039 Oldingi</button>':'')+
  (IDX<T.savollar.length-1?'<button class="go" onclick="keyingi()">Keyingi \u203a</button>'
    :'<button class="go" onclick="tugat()">\u2713 Testni yakunlash</button>')+'</div>';
 window.scrollTo(0,0);
}
function tanla(k){ JAV[T.savollar[IDX].id]=k; savol(); }
function keyingi(){ if(!JAV[T.savollar[IDX].id]){alert('Javobni tanlang');return;} IDX++; savol(); }
function tugat(){
 if(Object.keys(JAV).length<T.savollar.length){alert('Barcha savollarga javob bering');return;}
 rpc('ep_test_tugat',{p_token:TOK,p_id:T.id,p_javoblar:JAV}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');return;}
  var h='<h1>Natija</h1><div class="card"><div class="ball '+(d.ball>=4?'ok':(d.ball>=3?'':'bad'))+'">'+d.ball+' / 5</div>'+
    '<p class="center"><b>'+esc(d.oquvchi)+'</b><br><span class="mu">'+esc(d.fan)+' \u00b7 '+esc(T.sinf)+'</span></p></div>';
  T.savollar.forEach(function(q,i){
   var tanl=JAV[q.id];
   h+='<div class="res"><div class="t">'+(i+1)+'. '+esc(q.savol)+'</div><div class="g">Javob: <b>'+esc(q[tanl])+'</b></div></div>';
  });
  h+='<p class="sm mu center">Natija ota-onaga va rahbariyatga yuborildi.</p>';
  $('app').innerHTML=h;
  $('bar').innerHTML='<div class="bar"><button class="back" onclick="sinflar()">Sinflar</button>'+
    '<button class="go" onclick="fanlar('+BOLA.id+',\''+esc(BOLA.ism).replace(/'/g,"\\'")+'\')">Yana test</button></div>';
  window.scrollTo(0,0);
 })["catch"](function(){alert('Xatolik');});
}
(function(){
 try{
  var m=(location.hash||'').match(/[#&]t=([A-Za-z0-9]+)/);
  if(m&&m[1]){ TOK=m[1]; sessionStorage.setItem('test_tok',TOK); history.replaceState(null,'',location.pathname); }
 }catch(e){}
 var tg=window.Telegram&&window.Telegram.WebApp;
 if(tg&&tg.initData){ try{tg.expand();tg.ready();}catch(e){} }
 if(TOK) sinflar(); else kirish();
})();
</script></body></html>
