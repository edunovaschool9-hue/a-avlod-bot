<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EduNova — Mehnat shartnomasi</title>
<meta name="theme-color" content="#F6F1E6">
<style>
:root{--s:#F6F1E6;--c:#FFFDF8;--tx:#1C1C1C;--mu:#5C574B;--ln:#CFC7B6;--ac:#E85400;--gn:#15803d;--rd:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--s);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px 14px 70px}
.w{max-width:640px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.3px}
.sub{color:var(--mu);font-size:13px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:15px 16px;margin-bottom:13px}
label{display:block;font-size:12.5px;font-weight:800;color:var(--mu);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:11px;font-size:16px;background:#fff;color:var(--tx);margin-bottom:11px;font-family:inherit}
.h2{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin:18px 0 8px}
#txt{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px 15px;max-height:340px;overflow:auto;font-size:13.5px;line-height:1.6}
#txt .th{font-weight:800;margin:11px 0 4px}
#txt .tp{margin:0 0 7px}
#txt .ta{margin:0 0 5px;padding-left:13px}
#pad{background:#fff;border:2px dashed rgba(232,84,0,.55);border-radius:14px;touch-action:none;display:block;width:100%;max-width:560px}
button{border:none;border-radius:13px;font-weight:800;cursor:pointer;font-family:inherit}
.go{width:100%;padding:16px;background:linear-gradient(135deg,#E85400,#FF8A47);color:#fff;font-size:16.5px;margin-top:12px}
.go:disabled{opacity:.45}
.gray{padding:9px 14px;background:#fff;border:1px solid var(--ln);color:var(--mu);font-size:13px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin-top:10px}
.chk input{width:20px;height:20px;margin:2px 0 0}
#msg{font-size:14px;font-weight:700;margin-top:10px;min-height:20px}
#ok{display:none;text-align:center;padding:24px 16px}
#ok .big{font-size:44px}
#ok .num{font-size:26px;font-weight:900;color:var(--ac);margin:6px 0}
canvas#pdf{display:none}
</style></head><body><div class="w">

<h1>EduNova School — mehnat shartnomasi</h1>
<div class="sub">Ma’lumotlarni to‘ldiring, shartnomani o‘qing va telefonda imzo qo‘ying</div>

<div id="form">
  <div class="card">
    <div class="h2">1-qadam · Ma’lumotlaringiz</div>
    <label>F.I.Sh. (pasportdagidek)</label><input id="f-fio" placeholder="Aliyev Valijon Akmal o‘g‘li">
    <label>Pasport / ID raqami</label><input id="f-pas" placeholder="AB1234567">
    <label>Tug‘ilgan sana</label><input id="f-tug" type="date">
    <label>Lavozim</label><select id="f-lav">
      <option>O‘qituvchi</option><option>Stajor-o‘qituvchi</option><option>Sinf rahbari</option>
      <option>Administrator</option><option>Menejer</option><option>Yordamchi xodim</option></select>
    <label>Yashash manzili</label><input id="f-man" placeholder="Farg‘ona shahar, ...">
    <label>Telefon</label><input id="f-tel" type="tel" placeholder="+998 90 123 45 67">
    <label>Ishning boshlanishi</label><input id="f-bosh" type="date">
    <label>Ish haftasi (kun)</label><input id="f-kun" value="6">
    <label>Haftalik soat</label><input id="f-soat" value="24">
  </div>

  <div class="h2">2-qadam · Shartnoma matni</div>
  <div id="txt"></div>
  <label class="chk"><input type="checkbox" id="f-ok"><span>Shartnoma shartlari bilan to‘liq tanishdim va roziman</span></label>

  <div class="card" style="margin-top:13px">
    <div class="h2" style="margin-top:0">3-qadam · Imzo</div>
    <div style="color:var(--mu);font-size:13px;margin-bottom:8px">Barmog‘ingiz bilan imzo chizing</div>
    <canvas id="pad" width="560" height="190"></canvas>
    <button class="gray" style="margin-top:9px" onclick="padClear()">🧹 Tozalash</button>
  </div>

  <button class="go" id="btn" onclick="yubor()">✅ Imzolash va shartnomani olish</button>
  <div id="msg"></div>
</div>

<div id="ok">
  <div class="big">✅</div>
  <div style="font-weight:800;font-size:18px">Shartnoma imzolandi</div>
  <div class="num" id="ok-num"></div>
  <div style="color:var(--mu);font-size:14px">PDF nusxa yuklab olindi. Asl nusxani maktab ma’muriyatidan oling.</div>
  <button class="gray" style="margin-top:16px" onclick="location.reload()">Yangi shartnoma</button>
</div>

<canvas id="pdf" width="1654" height="2339"></canvas>
</div>

var T=[["p", "1. FERGHANA EDU NOVA SCHOOL mchj nomidan Nizom asosida faoliyat yurituvchi direktor Xolmatov Dostonbek Abdujabbor o‘g‘li keyingi o‘rinlarda «Ish beruvchi» deb ataladi va fuqaro {FIO} keyingi o‘rinlarda «Xodim» deb ataladi, mazkur shartnomani quyidagilar haqida tuzdik:"], ["p", "2. Xodim FERGHANA EDU NOVA SCHOOL mchj ga 1 shtat birligida {LAVOZIM} vazifasiga ishga qabul qilinadi."], ["p", "3. Shartnoma asosiy ish bo‘yicha tuzilgan hisoblanadi."], ["p", "4. Shartnoma nomuayyan muddatga tuzildi."], ["p", "5. Shartnoma bo‘yicha ishlash. Ishning boshlanishi: {BOSHLANISH}. Ishning tamom bo‘lishi: nomuayyan muddatga."], ["p", "6. Xodim sinov muddatisiz ishga qabul qilindi."], ["h", "7. Xodimning majburiyatlari:"], ["a", "a) O‘zbekiston Respublikasi Konstitutsiyasi, mehnat to‘g‘risidagi qonunchilik hamda boshqa qonunlar va qonunchilik hujjatlariga rioya qilish;"], ["a", "b) lavozim yo‘riqnomasida belgilangan o‘z xizmat majburiyatlarini vijdonan bajarish;"], ["a", "v) Ish beruvchining, yuqori turuvchi organ va tashkilotlarning buyruqlari, topshiriqlari, qarorlari, ko‘rsatmalarini bajarish (bunday buyruq yaqqol qonunchilikka zid bo‘lgan holatlar bundan mustasno);"], ["a", "g) mehnat va texnologiya intizomiga (ichki mehnat tartibi qoidalari, ustavlar va intizom to‘g‘risidagi qoidalar) rioya qilish;"], ["a", "d) ish beruvchining qonuniy talablarini bajarish;"], ["a", "y) bir yil muddat ichida kasbiy sertifikatga ega bo‘lish;"], ["a", "e) mehnatni muhofaza qilish, xavfsizlik texnikasi va ishlab chiqarish sanitariyasi talablariga rioya qilish;"], ["a", "j) lavozim yo‘riqnomalariga rioya qilish;"], ["a", "z) malaka majburiyatlariga rioya qilish;"], ["a", "i) qonunchilik va boshqa normativ hujjatlarga rioya qilish;"], ["a", "k) jamoa shartnomasi shartlariga rioya qilish;"], ["a", "l) xodim tomonidan qabul qilinadigan boshqa majburiyatlar;"], ["a", "m) yagona sifat va intizom nazorati tizimi: Xodim Ish beruvchining yagona sifat nazorati va intizom tizimi talablariga rioya qilishi shart. Ta’lim sifati, ichki tartib-qoidalar, o‘quvchilar bilan ishlash madaniyati va professional standartlarning muntazam buzilishi holatlarida Ish beruvchi amaldagi qonunchilik asosida mehnat shartnomasini bekor qilish huquqiga ega."], ["h", "8. Ish beruvchining majburiyatlari:"], ["a", "a) O‘zbekiston Respublikasi Konstitutsiyasi, mehnat to‘g‘risidagi qonunchilik hamda boshqa qonunlarga rioya qilish;"], ["a", "b) xodimning mehnatini tashkil etish, mehnatni muhofaza qilish va texnik xavfsizlikni ta’minlash qoidalari, lavozim yo‘riqnomasi, jamoa shartnomasi va boshqa ichki hujjatlar bilan tanishtirish;"], ["a", "v) mehnat va ishlab chiqarish intizomini ta’minlash;"], ["a", "g) ish haqi va qonunchilikda nazarda tutilgan boshqa to‘lovlarni o‘z vaqtida hamda to‘liq hajmda to‘lash;"], ["a", "d) xizmat vazifalarini bajarishda zarur xavfsiz va samarali mehnat sharoitlarini yaratish, kasbiy kompetensiyalarini oshirish;"], ["a", "e) ish joyini mehnatni muhofaza qilish va xavfsizlik texnikasi qoidalariga muvofiq jihozlash;"], ["a", "j) qonunchilikka va boshqa normativ hujjatlarga rioya qilish;"], ["a", "z) jamoa shartnomasi shartlariga rioya qilish;"], ["a", "i) ish beruvchi tomonidan qabul qilinadigan boshqa majburiyatlar."], ["p", "9. Mehnat shartnomasini tuzish va bekor qilish, shuningdek unga o‘zgartish va qo‘shimchalar kiritish qonunchilikda belgilangan tartibda «Yagona milliy mehnat tizimi» idoralararo dasturiy-apparat kompleksida ro‘yxatdan o‘tkazilishi shart."], ["p", "10. Ish kuni rejimi: ish vaqtining normal davomiyligi."], ["p", "11. Xodim uchun {KUN} kunlik ish haftasi belgilanadi. Bunda ish vaqtining davomiyligi haftasiga {SOAT} soatgacha etib belgilanadi."], ["h", "12. Mehnat haqi to‘lash. Xodimga quyidagicha haq to‘lash belgilanadi:"], ["a", "a) ish haqi shtatlar jadvaliga muvofiq belgilangan miqdorda to‘lanadi (ish haqi miqdori qonun hujjatlariga asosan o‘zgarishi mumkin);"], ["a", "b) amaldagi qonun hujjatlariga muvofiq mehnat sharoitlari bilan a", "b) SARIQ — o‘quvchilarning 60 foizidan kamrog‘i ishtirok etgan yoki dars 20–35 daqiqa boshqariladigan tartibda o‘tgan;"], ["a", "v) QIZIL — o‘qituvchi darsda bo‘lmagan yoki dars boshqarilmagan, sinfda tartibsizlik bo‘lgan."], ["p", "Nazorat ishi, diktant va shunga o‘xshash dars turlari jadvalda alohida belgilanadi va ularga alohida mezonlar qo‘llaniladi."], ["h", "19. Ogohlantirish bosqichlari va «Qora lenta»"], ["p", "Baholash hafta yakuni bo‘yicha amalga oshiriladi:"], ["a", "a) hafta davomida barcha kunlar yashil bo‘lsa yoki bitta sariq kun qayd etilsa — bosqich belgilanmaydi;"], ["a", "b) ikki va undan ortiq sariq kun — bir bosqich;"], ["a", "v) bitta qizil kun — bir bosqich;"], ["a", "g) ikki qizil kun — bevosita «Qora lenta»."], ["p", "Bosqichlar quyidagi tartibda qo‘llaniladi: 1-bosqich — tanbeh, sun’iy intellekt tahlili bilan birga xodim profilida qayd etiladi; 2-bosqich — sariq va qizil kunlar uchun mukofot (premiya) qismi hisoblanmaydi; 3-bosqich — «Qora lenta»."], ["p", "«Qora lenta» quyidagi hollarda ham beriladi: sababsiz ravishda darsni qoldirish; ish joyida spirtli ichimlik, giyohvand yoki psixotrop moddalar ta’siri ostida bo‘lish."], ["p", "Bekor qilish tartibi: yangi bosqich qayd etilmagan holda 30 kun o‘tgach bosqichlar bekor qilinadi; 90 kun davomida qoidabuzarlik qayd etilmasa «Qora lenta» avtomatik ravishda yechiladi; 3 (uch) oy davomida 3 (uchta) «Qora lenta» to‘plangan taqdirda mehnat shartnomasi amaldagi qonunchilik asosida bekor qilinishi mumkin."], ["h", "20. Mehnat haqi tarkibi"], ["p", "Xodimning oylik mehnat haqi ikki qismdan iborat bo‘ladi: 70 foiz — belgilangan (fiks) qism, u shartsiz to‘lanadi; 30 foiz — mukofot (premiya) qismi, maktab reglamentiga rioya qilinishiga bog‘liq ravishda hisoblanadi."], ["p", "Maktabning ichki tartib reglamentiga to‘liq rioya qilinganda xodimga mehnat haqi mukofot qismi bilan birga 100 foiz hajmda to‘lanadi. Mukofot qismini hisoblash tartibi maktabning «Mukofotlash to‘g‘risidagi nizomi»da belgilanadi. Belgilangan (fiks) qismdan hech qanday ushlab qolish amalga oshirilmaydi."], ["h", "21. Haftalik reyting va rag‘batlantirish"], ["p", "Har hafta o‘qituvchilar reytingi tuziladi va har dushanba kuni e’lon qilinadi. Reytingga quyidagilar ta’sir qiladi: ishga o‘z vaqtida kelish va ishdan o‘z vaqtida ketish; darslarning sifatli o‘tkazilishi va o‘quvchilarning test natijalari; o‘quvchilarning darsdagi faolligi."], ["p", "Rag‘batlantirish turlari: haftalik reytingda 1-o‘rinni egallagan xodimga maishiy sovg‘alar (tuxum, yog‘, maishiy kimyo mahsulotlari) uyiga yetkazib beriladi; 6 oy davomida to‘plangan reyting ballari bo‘yicha eng yuqori natijaga erishgan xodim BAA yoki Vetnamga sayohat yo‘llanmasi bilan taqdirlanadi."], ["h", "22. Mehnat haqi masalasida murojaat tartibi"], ["a", "a) barcha mehnat haqi hisob-kitoblari xodimga elektron shaklda taqdim etiladi;"], ["a", "b) mehnat haqi to‘lanishida kechikish yuzaga kelsa, xodimlar oldindan ogohlantiriladi;"], ["a", "v) fors-major xarakteridagi moliyaviy holatlarda xodimning murojaati 40 (qirq) kun ichida tinch yo‘l bilan hal qilinadi;"], ["a", "g) mehnat haqi va shaxsiy moliyaviy masalalar bo‘yicha murojaatlar belgilangan elektron tartibda qabul qilinadi;"], ["a", "d) Ta’lim nazorati bo‘limi operatorlari ota-onalarga o‘qish to‘lovi haqida eslatib boradi, bu esa mehnat haqi to‘lanishidagi kechikishlarni kamaytiradi."], ["h", "23. Apellyatsiya tartibi"], ["p", "Xodim darsga belgilangan rang yoki qo‘llanilgan bosqich bilan rozi bo‘lmasa, 3 (uch) ish kuni ichida platformadagi «Apellyatsiya» bo‘limi orqali murojaat qilishga haqli. Murojaat asosida dars yozuvi mas’ul xodim tomonidan tinglanadi. Yakuniy qaror sun’iy intellekt tomonidan emas, inson tomonidan qabul qilinadi."], ["p", "24. Maktabning ichki tartib reglamenti, «Mukofotlash to‘g‘risidagi nizom» va «Dars svetofori» tizimi qoidalari mazkur shartnomaga ilova qilinadi hamda uning ajralmas qismi hisoblanadi. Ushbu hujjatlarga kiritilgan o‘zgartishlar xodimga oldindan ma’lum q function yuklaDurl(durl,name){
  var head=durl.substring(0,durl.indexOf(',')),mime=(head.split(':')[1]||'').split(';')[0];
  var b=atob(durl.split(',')[1]),n=b.length,u=new Uint8Array(n);
  for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function yubor(){
  if(!V('f-fio')){alert('F.I.Sh. kiritilmagan');return;}
  if(!V('f-pas')){alert('Pasport (ID) kiritilmagan');return;}
  if(!V('f-tel')){alert('Telefon kiritilmagan');return;}
  if(!document.getElementById('f-ok').checked){alert('Shartnoma bilan tanishganingizni belgilang');return;}
  if(!drawn){alert('Imzo chizilmagan');return;}
  var btn=document.getElementById('btn');btn.disabled=true;
  msg('Saqlanmoqda…');
  var imzo=document.getElementById('pad').toDataURL('image/png');
  var d={fio:V('f-fio'),pasport:V('f-pas'),tugilgan:V('f-tug'),manzil:V('f-man'),telefon:V('f-tel'),
         lavozim:V('f-lav'),boshlanish:V('f-bosh'),kun:V('f-kun'),soat:V('f-soat')};
  SB.rpc('mehnat_saqla',{p_malumot:d,p_imzo:imzo}).then(function(r){
    if(r.error||!r.data||!r.data.ok){btn.disabled=false;msg('Xato: '+((r.error&&r.error.message)||(r.data&&r.data.xato)||'server'),'#b91c1c');return;}
    var raqam=r.data.raqam,hid=r.data.hujjat_id;
    msg('№ '+raqam+'/M berildi — shartnoma tayyorlanmoqda…','#15803d');
    Promise.all([img(EM),img(SL),img(SG),img(imzo),pdfLib()]).then(function(a){
      var t=new Date().toISOString().slice(0,10);
      var pages=sahifalar({em:a[0],sl:a[1],sg:a[2],im:a[3],raqam:raqam,sana:sana(t),d:d,matn:matn()});
      var durl=null;
      if(a[4]){try{var J=window.jspdf.jsPDF,doc=new J({orientation:'portrait',unit:'mm',format:'a4',compress:true});
        for(var i=0;i<pages.length;i++){if(i>0)doc.addPage('a4','portrait');
          doc.addImage(pages[i].toDataURL('image/jpeg',0.93),'JPEG',0,0,210,297,undefined,'FAST');}
        durl=doc.output('datauristring');}catch(e){durl=null;}}
      var fam=d.fio.split(/\s+/)[0].replace(/[^A-Za-z0-9\-]+/g,'');
      if(durl){yuklaDurl(durl,'MEHNAT_SHARTNOMA_'+raqam+'M_'+fam+'.pdf');
        if(hid)SB.rpc('hujjat_png_saqla',{p_id:hid,p_png:durl});}
      else{pages.forEach(function(p,i){setTimeout(function(){
        try{yuklaDurl(p.toDataURL('image/png'),'MEHNAT_SHARTNOMA_'+raqam+'M_'+fam+'_'+(i+1)+'.png');}catch(e){}},i*400);});}
      document.getElementById('form').style.display='none';
      document.getElementById('ok-num').textContent='№ '+raqam+'/M';
      document.getElementById('ok').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    });
  })["catch"](function(){btn.disabled=false;msg('Aloqa yo‘q — internetni tekshiring','#b91c1c');});
}
