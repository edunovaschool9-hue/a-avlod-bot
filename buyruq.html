<style>
:root{--s:#F6F1E6;--c:#FFFDF8;--tx:#1C1C1C;--mu:#5C574B;--ln:#CFC7B6;--ac:#E85400;--gn:#15803d;--rd:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--s);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:18px 14px 60px}
.w{max-width:760px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:11px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--c);color:var(--tx);font-weight:800;cursor:pointer;font-size:14px}
.tab.on{background:linear-gradient(135deg,#E85400,#FF8A47);color:#fff;border-color:transparent}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:15px 16px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
label{display:block;font-size:12.5px;font-weight:800;color:var(--mu);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:11px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
.h2{font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin:0 0 9px}
button{border:none;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
.b1{padding:13px 18px;background:linear-gradient(135deg,#E85400,#FF8A47);color:#fff;font-size:15px}
.b2{padding:13px 18px;background:var(--c);border:1px solid var(--ln);color:var(--tx);font-size:14px}
.b3{padding:7px 11px;background:var(--c);border:1px solid var(--ln);color:var(--tx);font-size:12.5px}
#pad{background:#fff;border:2px dashed rgba(232,84,0,.5);border-radius:14px;touch-action:none;display:block;width:100%;max-width:520px}
#cv{width:100%;border:1px solid var(--ln);border-radius:14px;background:#fff;display:block;margin-top:14px}
#msg{font-size:13.5px;font-weight:700;min-height:20px;margin-top:9px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 2px;border-bottom:1px solid var(--ln)}
.nm{color:var(--tx);font-size:14.5px;font-weight:650;flex:1;min-width:150px}
.mt{color:var(--mu);font-size:12.5px;font-weight:600}
.no{font-weight:900;color:var(--ac);min-width:78px}

  var yl=y+30, yr=y+30, wL=520, wR=520, xR=XR-wR;
  for(var i=0;i<Lb.length;i++){yl=wrap(c,Lb[i],XL,yl,wL,37,'c');}

  yl+=6;yr+=6;

  for(i=0;i<La.length;i++){yl=wrap(c,La[i],XL,yl,wL,30,'c');}

  if(im&&im.em){var ew=215,eh=Math.round(ew*im.em.height/im.em.width);c.drawImage(im.em,(W-ew)/2,y-6,ew,eh);y=Math.max(yl,yr,y-6+eh);}else{y=Math.max(yl,yr);}
  y+=14;
  c.fillRect(XL,y,XR-XL,3);c.fillRect(XL,y+7,XR-XL,3);y+=12;
  F(c,40,true);var t='B U Y R U Q';c.fillText(t,(W-c.measureText(t).width)/2,y+42);y+=54;
  c.fillRect(XL,y,XR-XL,3);c.fillRect(XL,y+7,XR-XL,3);y+=22;

  var nn='\u2116 '+(raqam||'______')+' /O\u2018Q';c.fillText(nn,(W-c.measureText(nn).width)/2,y+24);

  var M=matn();
  F(c,33,true);y=wrap(c,M.sarlavha,XL,y+20,XR-XL,42,'l')+8;
  F(c,30,false);y=wrap(c,M.kirish,XL,y+14,XR-XL,41,'l')+12;
  F(c,34,true);var b='BUYURAMAN:';c.fillText(b,(W-c.measureText(b).width)/2,y+28);y+=54;
  for(i=0;i<M.bandlar.length;i++){
    F(c,30,true);c.fillText((i+1)+'.',XL,y+36);
    F(c,30,false);y=wrap(c,M.bandlar[i],XL+52,y+36,XR-XL-52,40,'l')-40+8;
  }
  F(c,26,false,true);y=wrap(c,M.asos,XL,y+40,XR-XL,34,'l')+10;

  /* imzo */
  F(c,32,true);c.fillText('\u201CEDU NOVA SCHOOL\u201D',XL,y+36);
  c.fillText('maktab direktori:',XL,y+76);
  if(im&&im.sl){var sw=250,sh=Math.round(sw*im.sl.height/im.sl.width);c.drawImage(im.sl,XL,y+94,sw,sh);}
  if(im&&im.sg){var gw=380,gh=Math.round(gw*im.sg.height/im.sg.width);
    var nw=c.measureText('D.Xolmatov').width;c.drawImage(im.sg,XR-nw-30-gw,y+40,gw,gh);
    c.fillText('D.Xolmatov',XR-nw,y+40+gh-14);}
  var ty=y+96+(im&&im.sl?Math.round(250*im.sl.height/im.sl.width):120)+34;
  F(c,26,false);
  c.fillText('Buyruq bilan tanishdim:  ota-ona (qonuniy vakil) ______________________________  imzo:',XL,ty);
  if(im&&im.im){var iw=230,ih=Math.round(iw*im.im.height/im.im.width);
    if(ih>92){ih=92;iw=Math.round(ih*im.im.width/im.im.height);}

  else{c.fillText('____________',XR-200,ty);}

function draw(raqam){
  return Promise.all([loadImgs(),img(imzoOl())]).then(function(a){

/* ---------- PDF ---------- */
function pdfLib(){if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(true);
  return new Promise(function(res){var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
    s.onload=function(){res(!!(window.jspdf&&window.jspdf.jsPDF));};s.onerror=function(){res(false);};
    document.head.appendChild(s);});}
function durlYukla(durl,name){
  var head=durl.substring(0,durl.indexOf(',')),mime=(head.split(':')[1]||'').split(';')[0];
  var b=atob(durl.split(',')[1]),n=b.length,u=new Uint8Array(n);
  for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function fayl(raqam){
  var fam=(V('f-fio')||'buyruq').split(/\s+/)[0].replace(/[^A-Za-z0-9\-]+/g,'');
  return (TUR==='chb'?'BUYRUQ_CHIQARISH_':'BUYRUQ_QABUL_')+(raqam||'X')+'OQ_'+fam;}
function yukla(raqam){
  return draw(raqam).then(function(){return pdfLib();}).then(function(ok){
    var cv=document.getElementById('cv');
    if(ok){try{var J=window.jspdf.jsPDF,doc=new J({orientation:'portrait',unit:'mm',format:'a4',compress:true});
      doc.addImage(cv.toDataURL('image/jpeg',0.94),'JPEG',0,0,210,297,undefined,'FAST');
      var durl=doc.output('datauristring');durlYukla(durl,fayl(raqam)+'.pdf');return durl;}catch(e){}}
    try{durlYukla(cv.toDataURL('image/png'),fayl(raqam)+'.png');}catch(e){}
    return null;});
}

function keyingi(){

    if(r.error)return null;
    var e=document.getElementById('f-num'); if(e&&!manual)e.value=r.data;
    return r.data;})["catch"](function(){return null;});
}
function saqlaYukla(){
  if(!V('f-fio')){alert('O\u2018quvchining F.I.Sh. kiritilmagan');return;}
  var m=maktab();
  msg('Raqam berilmoqda\u2026');
  SB.rpc('hujjat_qayd',{p_oquv:oquvYili(),p_seriya:'OQ',p_turi:TUR,p_sana:V('f-sana')||null,
    p_fio:V('f-fio'),p_tugilgan:V('f-tug')||null,p_sinf:V('f-sinf')||null,p_maktab:m.qisqa,
    p_hudud:V('f-hud'),p_malumot:{'xj-fio':V('f-fio'),'xj-sana':V('f-sana'),'xj-tug':V('f-tug'),
      'xj-sinf':V('f-sinf'),'xj-mk':V('f-mk'),'xj-hudud':V('f-hud'),'xj-mkfull':V('f-mkfull'),
      'xj-ktnum':V('f-ktn'),'xj-ktsana':V('f-kts'),'xj-ourkt':V('f-ourkt'),
      'xj-arnum':V('f-arn'),'xj-arsana':V('f-ars')},
    p_kim:'buyruq sahifasi',p_raqam:(manual&&V('f-num'))?parseInt(V('f-num'),10):null
  }).then(function(r){
    if(r.error||!r.data||!r.data.ok){msg((r.data&&r.data.msg)||'Raqam berilmadi','#b91c1c');return;}
    var raqam=r.data.raqam,hid=r.data.id;
    var e=document.getElementById('f-num'); if(e)e.value=raqam;
    manual=false;numTouch();
    msg('\u2713 \u2116 '+raqam+'/O\u2018Q berildi \u2014 PDF tayyorlanmoqda\u2026','#15803d');
    yukla(raqam).then(function(durl){
      if(durl&&hid)SB.rpc('hujjat_png_saqla',{p_id:hid,p_png:durl}).then(function(){royxat();})["catch"](function(){});
      else royxat();
    });
  })["catch"](function(){msg('Aloqa yo\u2018q','#b91c1c');});
}
function royxat(){
  var box=document.getElementById('list');
  box.innerHTML='<div class="mt" style="padding:8px">Yuklanmoqda\u2026</div>';
  document.getElementById('ltitle').textContent=(TUR==='chb'?'📚 Chiqarish buyruqlari':'📚 Qabul buyruqlari');
  SB.rpc('hujjat_oxirgi',{p_oquv:oquvYili()}).then(function(q){
    var e=document.getElementById('oxirgi');
    if(e&&!q.error&&q.data)e.textContent='oxirgi: '+(q.data.OQ||0)+'/O\u2018Q \u00B7 '+oquvYili();
  })["catch"](function(){});
  SB.rpc('hujjat_royxat_turi',{p_oquv:oquvYili(),p_turi:TUR,p_bekor:false,p_limit:200}).then(function(r){
    if(r.error){box.innerHTML='<div class="mt" style="padding:8px;color:#b45309">Reyestr topilmadi</div>';return;}
    cache=r.data||[];
    if(!cache.length){box.innerHTML='<div class="mt" style="padding:8px">Hozircha buyruq yo\u2018q</div>';return;}
    box.innerHTML=cache.map(function(x,i){
      return '<div class="row"><span class="no">\u2116 '+x.raqam+'/O\u2018Q</span>'
        +'<span class="nm">'+(x.fio||'')+'</span>'
        +'<span class="mt">'+(x.sana||'')+(x.sinf?' \u00B7 '+x.sinf+'-sinf':'')+'</span>'
        +(x.fayl_bor?'<button class="b3" onclick="arxiv('+i+')">🖼 Arxiv</button>':'')
        +'<button class="b3" onclick="ochish('+i+')">↩ Ochish</button></div>';
    }).join('');
  })["catch"](function(){});
}
function arxiv(i){
  var x=cache[i]; if(!x)return; msg('Arxivdan olinmoqda\u2026');
  SB.rpc('hujjat_png_ol',{p_id:x.id}).then(function(r){
    if(r.error||!r.data){msg('Arxivda nusxa yo\u2018q','#b45309');return;}
    var ext=(String(r.data).indexOf('application/pdf')>=0)?'.pdf':'.png';
    var fam=(x.fio||'buyruq').split(/\s+/)[0].replace(/[^A-Za-z0-9\-]+/g,'');
    durlYukla(r.data,(x.turi==='chb'?'BUYRUQ_CHIQARISH_':'BUYRUQ_QABUL_')+x.raqam+'OQ_'+fam+ext);
    msg('\u2713 Yuklab olindi','#15803d');
  })["catch"](function(){msg('Aloqa yo\u2018q','#b91c1c');});
}
function ochish(i){
  var x=cache[i]; if(!x)return; var m=x.malumot||{};
  if(x.turi!==TUR)tab(x.turi);
  var map={'f-fio':'xj-fio','f-sana':'xj-sana','f-tug':'xj-tug','f-sinf':'xj-sinf','f-mk':'xj-mk',
           'f-hud':'xj-hudud','f-mkfull':'xj-mkfull','f-ktn':'xj-ktnum','f-kts':'xj-ktsana',
           'f-ourkt':'xj-ourkt','f-arn':'xj-arnum','f-ars':'xj-arsana'};
  for(var k in map){var e=document.getElementById(k); if(e&&m[map[k]]!==undefined)e.value=m[map[k]];}
  var n=document.getElementById('f-num'); if(n)n.value=x.raqam;
  manual=true;numTouch();hududUI();draw(x.raqam);
  msg('Reyestrdan ochildi \u2014 yangi raqam berilmaydi','#5C574B');
  window.scrollTo({top:0,behavior:'smooth'});
}
