function install(){
 if(document.getElementById("ap-qabul"))return true;

 /* --- stil --- */
 var st=document.createElement("style");st.textContent=CSS;document.head.appendChild(st);

 /* --- mavjud panelni topamiz (ap- bilan boshlanadigan) --- */
 var panels=document.querySelectorAll('[id^="ap-"]');
 var proto=panels.length?panels[panels.length-1]:null;
 var panel=document.createElement("div");
 panel.id="ap-qabul";
 if(proto){panel.className=proto.className;proto.parentNode.appendChild(panel)}
 else{panel.className="admin-panel";document.body.appendChild(panel)}
 panel.innerHTML=PANEL;

 /* --- menyu qatorini topamiz: showPanel chaqiradigan element --- */
 var all=document.querySelectorAll("[onclick]"),items=[];
 for(var i=0;i<all.length;i++){
  var oc=all[i].getAttribute("onclick")||"";
  if(/showPanel\s*\(/.test(oc))items.push(all[i]);
 }
 if(!items.length)items=[].slice.call(document.querySelectorAll("[data-key]"));

 if(items.length){
  var last=items[items.length-1],mi=last.cloneNode(true);
  mi.setAttribute("data-key","qabul");
  mi.setAttribute("onclick","showPanel('qabul')");
  mi.classList.remove("active","on","selected");
  var icon=mi.querySelector("span,i");
  var wrote=false;
  for(var k=0;k<mi.childNodes.length;k++){
   var n=mi.childNodes[k];
   if(n.nodeType===3&&n.textContent.trim()){n.textContent=" Qabul";wrote=true}
  }
  if(icon&&(icon.tagName==="SPAN"||icon.tagName==="I")&&!icon.children.length)icon.textContent="🎒";
  if(!wrote)mi.appendChild(document.createTextNode(" Qabul"));
  last.parentNode.insertBefore(mi,last.nextSibling);
 }else{
  console.warn("QABUL: menyu topilmadi. Panel yaratildi, uni showPanel('qabul') bilan oching.");
 }
 return true;
}

  F.ism=g("qb-ism").value.trim();F.ota=g("qb-ota").value.trim();F.tel=g("qb-tel").value.trim();
  F.sap=g("qb-sap").value.trim();F.yon=g("qb-yon").value;F.sinf=g("qb-sinf").value;
  if(!F.ism||!F.ota||!F.tel){alert(t.fill);return}
  var gr=grp(F.sinf),B=BANK[gr];
  Q.T={ism:F.ism,grp:gr,sec:0,i:0,cur:null,saved:false,done:false,
   bank:{ona:B.ona[F.yon],mat:B.mat,eng:B.eng},ans:{ona:[],mat:[],eng:[],int:{}}};
  draw()},
 pick:function(i){Q.T.cur=i;draw()},
 multi:function(i){var T=Q.T,it=INT[T.i],c=T.ans.int[it.id]||[];
  c=c.indexOf(i)>-1?c.filter(function(v){return v!==i}):c.concat([i]);T.ans.int[it.id]=c;draw()},
 next:function(){var T=Q.T;
  if(T.sec<3){var k=["ona","mat","eng"][T.sec],arr=T.bank[k];
   T.ans[k].push(T.cur===arr[T.i].a?1:0);T.i++;T.cur=null;
   if(T.i>=arr.length){T.sec++;T.i=0}return draw()}
  var it=INT[T.i];if(!it.multi)T.ans.int[it.id]=T.cur;
  T.i++;T.cur=null;
  if(T.i<INT.length)return draw();
  QAB.finish()},
 finish:function(){var t=x(),T=Q.T;
  function pc(a){return a.length?Math.round(a.reduce(function(s,v){return s+v},0)/a.length*100):0}
  var ona=pc(T.ans.ona),mat=pc(T.ans.mat),eng=pc(T.ans.eng),total=Math.round((ona+mat+eng)/3),tv;
  if(total<40)tv=t.tv.e;else if(mat>=80)tv=t.tv.a;else if(eng<50)tv=t.tv.b;
  else if(ona<50)tv=t.tv.c;else tv=t.tv.d;
  T.res={ona:ona,mat:mat,eng:eng,total:total,tav:tv};
  T.login=mkLogin(T.ism);T.parol=mkParol();T.done=true;draw()},
 save:async function(){var T=Q.T,F=Q.F,t=x();
  try{await addRow({ism:T.ism,sinf:parseInt(F.sinf,10),yonalish:F.yon,ota_ona:F.ota,telefon:F.tel,
   saport:F.sap,natijalar:T.res,qiziqishlar:T.ans.int,umumiy_ball:T.res.total,tavsiya:T.res.tav,
   login:T.login,parol_vaqt:T.parol,parol_almashtirildi:false});
   T.saved=true;draw()}catch(e){console.error(e);alert(t.err)}},
 reset:function(){Q.T=null;Q.F.ism="";Q.F.ota="";Q.F.tel="";draw()}
};

function boot(){if(install()){Q.SB=findSB();draw()}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(boot,500)});
else setTimeout(boot,500);
})();
</script>

</body>
