<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EduNova — Davomat</title><meta name="theme-color" content="#F6F1E6">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 background:#F6F1E6;color:#1A2238;font-size:16px;line-height:1.4}
.wrap{max-width:620px;margin:0 auto;padding:12px 12px 90px}
.top{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.logo{font-weight:800;font-size:17px}.out{margin-left:auto;font-size:13px;color:#8b8271;text-decoration:underline}
h1{font-size:19px;margin:0 0 10px}
.card{background:#fff;border:1px solid #e6dcc8;border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:13px;border:1px solid #d9cfba;border-radius:10px;font-size:17px;background:#fff;color:#1A2238}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#FF7A00;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
.btn.sec{background:#fff;color:#1A2238;border:1px solid #d9cfba}
.btn.red{background:#fff;color:#b91c1c;border:1px solid #fecaca}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{background:#fff;border:1px solid #e0d5bf;border-radius:12px;padding:13px 6px;text-align:center;font-weight:800;font-size:17px}
.cls small{display:block;font-weight:600;color:#8b8271;font-size:11px;margin-top:3px}
.cls.done{background:#dcfce7;border-color:#86efac}
.cls.part{background:#fff7ed;border-color:#fed7aa}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hdr b{font-size:22px}
.cnt{margin-left:auto;font-weight:800;font-size:20px}
.cnt small{font-weight:600;color:#8b8271;font-size:12px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e6dcc8;
 border-radius:12px;padding:14px 12px;margin-bottom:8px;font-size:17px;font-weight:600}
.row .nm{flex:1}
.row.keldi{background:#dcfce7;border-color:#22c55e}
.row.kelmadi{background:#fee2e2;border-color:#ef4444}
.row.kech{background:#fff7ed;border-color:#fb923c}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px;background:#eee6d6;color:#7a7161}
.row.keldi .tag{background:#22c55e;color:#fff}
.row.kelmadi .tag{background:#ef4444;color:#fff}
.row.kech .tag{background:#fb923c;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#F6F1E6;border-top:1px solid #e0d5bf;
 padding:10px 12px;display:flex;gap:8px;max-width:620px;margin:0 auto}
.bar button{flex:1;padding:13px;border:0;border-radius:11px;font-weight:700;font-size:15px}
.bar .all{background:#22c55e;color:#fff}.bar .add{background:#1A2238;color:#fff}.bar .back{background:#fff;border:1px solid #d9cfba;color:#1A2238}
.err{color:#b91c1c;font-size:14px;min-height:18px}
.mu{color:#8b8271}.sm{font-size:13px}.center{text-align:center}
.stat{display:flex;gap:8px;margin-bottom:12px}
.stat div{flex:1;background:#fff;border:1px solid #e6dcc8;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat small{color:#8b8271;font-size:11px}

.hafta{display:flex;gap:5px;margin-bottom:8px}
.hafta .kun{flex:1;padding:8px 2px;border:1px solid #e0d5bf;background:#fff;border-radius:10px;
 font-size:11px;font-weight:700;color:#8b8271;line-height:1.15}
.hafta .kun b{display:block;font-size:17px;color:#1A2238;margin-top:2px}
.hafta .kun.on{background:#1A2238;border-color:#1A2238;color:#fff}
.hafta .kun.on b{color:#fff}
.hafta .kun.bugun{border-color:#FF7A00}
.hafta .kun.off{opacity:.35}
.navh{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:#6b6355}
.navh span{flex:1;text-align:center;font-weight:700}
.navh button{width:40px;padding:6px;border:1px solid #d9cfba;background:#fff;border-radius:9px;font-size:17px;color:#1A2238}
.bar .wk{background:#eee6d6;color:#1A2238;flex:0 0 74px}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid #e6dcc8;border-radius:12px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{padding:7px 3px;font-size:11px;color:#8b8271;border-bottom:1px solid #e6dcc8;font-weight:700}
.tbl th span{font-size:14px;color:#1A2238}
.tbl th.bg{color:#FF7A00}
.tbl td{padding:8px 3px;text-align:center;border-bottom:1px solid #f0e9db}
.tbl .nmc{text-align:left;padding-left:10px;font-weight:600;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tbl .c{width:34px;font-weight:800}
.tbl .c.keldi{background:#dcfce7;color:#166534}
.tbl .c.kelmadi{background:#fee2e2;color:#b91c1c}
.tbl .c.kech{background:#fff7ed;color:#c2410c}
.tbl .c.yoq{color:#d6cdbb}
.tbl .jam td{font-weight:800;background:#faf6ec;border-top:1px solid #e6dcc8}

.xls{display:flex;gap:8px;margin:10px 0}
.xls button{flex:1;padding:12px;border:1px solid #1A2238;background:#1A2238;color:#fff;
 border-radius:11px;font-weight:700;font-size:14px}
.xls button:disabled{opacity:.5}

.row .nm{display:flex;flex-direction:column}
.row .tl{font-size:12px;font-weight:600;color:#8b8271;margin-top:2px}
.row .call{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:#22c55e;color:#fff;
 display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.btn.call{background:#1A2238;margin-bottom:4px}
.sinfb{font-weight:800;font-size:13px;color:#8b8271;margin:14px 0 6px;letter-spacing:.5px}
.qrow{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e6dcc8;
 border-radius:12px;padding:11px 12px;margin-bottom:7px}
.qi{flex:1;min-width:0}
.qn{font-weight:700;font-size:16px}
.qt{font-size:14px;color:#1A2238;font-weight:600;margin-top:2px}
.qt .yoq{color:#b91c1c;font-weight:600;font-size:13px}
.qz{font-size:12px;color:#6b6355;margin-top:3px;font-style:italic}
.qcall{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#22c55e;color:#fff;
 display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:20px}
.qnote{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#fff;
 border:1px solid #d9cfba;color:#1A2238;font-size:17px}
@media print{
 .bar,.xls,.btn,.hafta,.navh,.top{display:none!important}
 .qrow{break-inside:avoid;border:1px solid #999}
 .qcall,.qnote{display:none!important}
 body{background:#fff}
}
</style></head><body><div class="wrap">
<div class="top"><span class="logo">EduNova · Davomat</span><a class="out" href="#" onclick="chiq();return false;">Chiqish</a></div>
<div id="app"></div></div><div id="bar"></div>
<script>
var SB_URL="https://unaodltahuevrfnarfha.supabase.co", SB_KEY="sb_publishable_i705NKn0jH1yGmIZJGAdgQ_wyzlcrZP";
var TOK=sessionStorage.getItem('dav_tok')||'', D=null, L=null, SINF=0, SINFNOM='';
var KUN=null, HAF=null;
var KN=['Du','Se','Ch','Pa','Ju','Sh','Ya'];
var SIKL=['keldi','kelmadi','kech'];
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rpc(fn,a){return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
 headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
 body:JSON.stringify(a||{})}).then(function(r){return r.json();});}
function chiq(){sessionStorage.removeItem('dav_tok');TOK='';D=null;$('bar').innerHTML='';kirishEkran();}
function kirishEkran(){
 $('bar').innerHTML='';
 $('app').innerHTML='<h1>Kirish</h1><div class="card"><label class="sm mu">PIN kod</label>'+
  '<input id="pin" type="password" inputmode="numeric" autocomplete="off">'+
  '<div class="err" id="e"></div><button class="btn" onclick="kir()">Kirish</button></div>';
 var p=$('pin'); if(p){p.focus();p.addEventListener('keydown',function(ev){if(ev.key==='Enter')kir();});}
}
function kir(){
 var v=($('pin').value||'').trim(); if(!v)return;
 $('e').textContent='';
 rpc('ep_kirish',{p_pin:v}).then(function(d){
  if(!d||!d.token){$('e').textContent='PIN noto\u2018g\u2018ri';return;}
  if(d.rol!=='admin'&&d.rol!=='oqituvchi'){$('e').textContent='Ruxsat yo\u2018q';return;}
  TOK=d.token;sessionStorage.setItem('dav_tok',TOK);sinflar();
 })["catch"](function(){$('e').textContent='Xatolik';});
}
function sinflar(){
 SINF=0;$('bar').innerHTML='';
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_sinflar',{p_token:TOK,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){chiq();return;}
  D=d;sinfChiz();
 })["catch"](function(){$('app').innerHTML='<p class="mu">Xatolik</p>';});
}
function haftaBosh(iso){
 var d=new Date(iso+'T00:00:00'); var w=(d.getDay()+6)%7;
 d.setDate(d.getDate()-w); return d;
}
function iso(d){var m=('0'+(d.getMonth()+1)).slice(-2),g=('0'+d.getDate()).slice(-2);
 return d.getFullYear()+'-'+m+'-'+g;}
function kunlarChiz(){
 var bugun=D.bugun||D.kun, tanlangan=KUN||D.kun;
 var b=haftaBosh(tanlangan), h='<div class="hafta">';
 for(var i=0;i<7;i++){
  var d=new Date(b); d.setDate(b.getDate()+i); var s=iso(d);
  var kel=s>bugun, on=(s===tanlangan);
  h+='<button class="kun'+(on?' on':'')+(kel?' off':'')+(s===bugun?' bugun':'')+'"'+
     (kel?' disabled':' onclick="kunTanla(\''+s+'\')"')+'>'+
     KN[i]+'<b>'+d.getDate()+'</b></button>';
 }
 h+='</div>';
 h+='<div class="navh"><button onclick="haftaSurish(-7)">\u2039</button>'+
    '<span>'+esc(tanlangan)+(tanlangan===bugun?' \u00B7 bugun':'')+'</span>'+
    '<button onclick="haftaSurish(7)">\u203A</button></div>';
 return h;
}
function kunTanla(s){KUN=s;sinflar();}
function haftaSurish(n){
 var d=new Date((KUN||D.kun)+'T00:00:00'); d.setDate(d.getDate()+n);
 var s=iso(d); if(s>(D.bugun||D.kun)) s=(D.bugun||D.kun);
 KUN=s; sinflar();
}
function sinfChiz(){
 var h=kunlarChiz();
 h+='<div class="stat"><div><b>'+D.keldi+'</b><small>KELDI</small></div>'+
   '<div><b>'+(D.belgilangan-D.keldi)+'</b><small>KELMADI</small></div>'+
   '<div><b>'+(D.jami-D.belgilangan)+'</b><small>BELGILANMAGAN</small></div></div>';
 h+='<div class="grid">';
 D.sinflar.forEach(function(s){
  var cl=s.jami>0&&s.belgi>=s.jami?' done':(s.belgi>0?' part':'');
  h+='<button class="cls'+cl+'" onclick="ochish('+s.id+',\''+esc(s.nom)+'\')">'+esc(s.nom)+
     '<small>'+s.keldi+'/'+s.jami+'</small></button>';
 });
 h+='</div>';
 h+='<button class="btn call" onclick="kelmadi()">\u260E Kelmaganlar \u2014 obzvon</button>';
 h+='<div class="xls"><button onclick="kunExcel(this)">\u2b07 Kun \u2014 Excel</button>'+
    '<button onclick="haftaExcel(this)">\u2b07 Hafta \u2014 Excel</button></div>';
 h+='<button class="btn sec" onclick="sinflar()">Yangilash</button>';
 $('app').innerHTML=h;
}

function ochish(id,nom){
 SINF=id;SINFNOM=nom;
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_royxat',{p_token:TOK,p_sinf_id:id,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');sinflar();return;}
  L=d;lstChiz();
 })["catch"](function(){alert('Xatolik');sinflar();});
}
function sanoq(){
 var k=0,n=0,b=0;
 L.royxat.forEach(function(o){ if(o.holat==='keldi')k++; else if(o.holat)n++; else b++; });
 return {k:k,n:n,b:b};
}
function lstChiz(){
 var s=sanoq();
 var h='<div class="hdr"><b>'+esc(SINFNOM)+'</b>'+
   '<span class="sm mu">'+esc(L.kun)+'</span>'+
   '<span class="cnt">'+s.k+'/'+L.royxat.length+' <small>keldi</small></span></div>';
 L.royxat.forEach(function(o){
  var cl=o.holat?(' '+o.holat):'';
  var tg=o.holat==='keldi'?'KELDI':(o.holat==='kelmadi'?'KELMADI':(o.holat==='kech'?'KECH':'\u2014'));
  h+='<div class="row'+cl+'" id="r'+o.id+'">'+
     '<span class="nm" onclick="belgi('+o.id+')">'+esc(o.ism)+
     (o.tel?'<span class="tl">'+esc(o.tel)+'</span>':'')+'</span>'+
     (o.tel?'<a class="call" href="'+('tel:'+String(o.tel).replace(/[^0-9+]/g,''))+'" onclick="event.stopPropagation()">\u260E</a>':'')+
     '<span class="tag" onclick="belgi('+o.id+')">'+tg+'</span></div>';
 });
 if(!L.royxat.length)h+='<p class="mu center">Bu sinfda o\u2018quvchi yo\u2018q</p>';
 $('app').innerHTML=h;
 $('bar').innerHTML='<div class="bar"><button class="back" onclick="sinflar()">\u2039 Sinflar</button>'+
   '<button class="all" onclick="hammasi()">Hammasi keldi</button>'+
   '<button class="add" onclick="qolda()">+ Qo\u2018shish</button>'+
   '<button class="wk" onclick="hafta()">Hafta</button></div>';
 window.scrollTo(0,0);
}
function belgi(id){
 var o=null; L.royxat.forEach(function(x){if(x.id===id)o=x;});
 if(!o)return;
 var i=SIKL.indexOf(o.holat||''); var yangi=SIKL[(i+1)%SIKL.length];
 o.holat=yangi;
 var el=$('r'+id);
 el.className='row '+yangi;
 el.querySelector('.tag').textContent=yangi.toUpperCase();
 var s=sanoq();
 var c=document.querySelector('.cnt');
 if(c)c.innerHTML=s.k+'/'+L.royxat.length+' <small>keldi</small>';
 rpc('ep_dav_belgi',{p_token:TOK,p_oquvchi_id:id,p_holat:yangi,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){el.style.opacity='0.45';}
 })["catch"](function(){el.style.opacity='0.45';});
}
function hammasi(){
 if(!confirm(SINFNOM+' \u2014 hammasini "keldi" deb belgilaymizmi?'))return;
 rpc('ep_dav_hammasi',{p_token:TOK,p_sinf_id:SINF,p_holat:'keldi',p_kun:KUN}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');return;}
  ochish(SINF,SINFNOM);
 })["catch"](function(){alert('Xatolik');});
}
function qolda(){
 var ism=prompt(SINFNOM+' \u2014 o\u2018quvchining ism va familiyasi:');
 if(!ism||ism.trim().length<4)return;
 rpc('ep_dav_qol',{p_token:TOK,p_sinf_id:SINF,p_ism:ism.trim()}).then(function(d){
  if(!d||!d.ok){alert('Xatolik: '+((d&&d.xato)||'server'));return;}
  return rpc('ep_dav_belgi',{p_token:TOK,p_oquvchi_id:d.id,p_holat:'keldi',p_kun:KUN});
 }).then(function(){ ochish(SINF,SINFNOM); })
 ["catch"](function(){alert('Xatolik');});
}
function hafta(){
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_hafta',{p_token:TOK,p_sinf_id:SINF,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');ochish(SINF,SINFNOM);return;}
  HAF=d;haftaChiz();
 })["catch"](function(){alert('Xatolik');ochish(SINF,SINFNOM);});
}
function belgiHarf(h){
 if(h==='keldi')return '+'; if(h==='kelmadi')return '\u2013';
 if(h==='kech')return 'K'; if(h==='sababli')return 'S'; return '';
}
function haftaChiz(){
 var d=HAF;
 var h='<div class="hdr"><b>'+esc(SINFNOM)+'</b><span class="sm mu">hafta</span></div>';
 h+='<div class="tblwrap"><table class="tbl"><thead><tr><th class="nmc">O\u2018quvchi</th>';
 for(var i=0;i<7;i++){
  var s=d.kunlar[i], dd=new Date(s+'T00:00:00');
  h+='<th'+(s===d.bugun?' class="bg"':'')+'>'+KN[i]+'<br><span>'+dd.getDate()+'</span></th>';
 }
 h+='</tr></thead><tbody>';
 d.royxat.forEach(function(o){
  h+='<tr><td class="nmc">'+esc(o.ism)+'</td>';
  for(var i=0;i<7;i++){
   var v=o.holatlar[i]||'';
   h+='<td class="c '+(v||'yoq')+'">'+belgiHarf(v)+'</td>';
  }
  h+='</tr>';
 });
 h+='<tr class="jam"><td class="nmc">Keldi</td>';
 for(var i=0;i<7;i++){ h+='<td class="c">'+d.kun_hisob[i].keldi+'</td>'; }
 h+='</tr></tbody></table></div>';
 h+='<p class="sm mu">+ keldi \u00B7 \u2013 kelmadi \u00B7 K kech</p>';
 h+='<div class="xls"><button onclick="haftaExcel(this)">\u2b07 Hafta \u2014 Excel</button></div>';
 $('app').innerHTML=h;
 $('bar').innerHTML='<div class="bar"><button class="back" onclick="ochish('+SINF+',\''+esc(SINFNOM)+'\')">\u2039 Kun</button>'+
   '<button class="back" onclick="sinflar()">Sinflar</button></div>';
 window.scrollTo(0,0);
}
if(TOK) sinflar(); else kirishEkran();

/* ---------- Excel yuklab olish ---------- */
function xlsxYukla(){
 if(window.XLSX) return Promise.resolve(true);
 return new Promise(function(res){
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){res(!!window.XLSX);};
  s.onerror=function(){res(false);};
  document.head.appendChild(s);
  setTimeout(function(){res(!!window.XLSX);},9000);
 });
}
function csvTushir(aoa,nom){
 var sep=';';
 var txt=aoa.map(function(r){
  return r.map(function(c){
   var v=(c==null?'':String(c));
   if(v.indexOf(sep)>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0) v='"'+v.replace(/"/g,'""')+'"';
   return v;
  }).join(sep);
 }).join('\r\n');
 var blob=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8;'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob); a.download=nom+'.csv';
 document.body.appendChild(a); a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
function tushir(aoa,nom,varaq){
 return xlsxYukla().then(function(bor){
  if(!bor){ csvTushir(aoa,nom); return 'csv'; }
  var ws=window.XLSX.utils.aoa_to_sheet(aoa);
  var w=[]; for(var i=0;i<aoa[0].length;i++){ w.push({wch: i===1?28:(i===0?8:11)}); }
  ws['!cols']=w;
  var wb=window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb,ws,varaq||'Davomat');
  window.XLSX.writeFile(wb,nom+'.xlsx');
  return 'xlsx';
 });
}
function soz(h){
 if(h==='keldi')return 'Keldi'; if(h==='kelmadi')return 'Kelmadi';
 if(h==='kech')return 'Kech qoldi'; if(h==='sababli')return 'Sababli'; return 'Belgilanmagan';
}
function kunExcel(btn){
 var t=btn.textContent; btn.disabled=true; btn.textContent='\u2026';
 var kun=KUN||(D&&D.kun);
 rpc('ep_dav_export',{p_token:TOK,p_kun:kun}).then(function(d){
  if(!d||!d.ok) throw new Error('rpc');
  var aoa=[['EduNova School \u2014 kunlik davomat'],
           ['Sana', d.kun],
           ['Keldi', d.keldi+' / '+d.jami],
           [],
           ['Sinf','O\u2018quvchi','Holat','Vaqt']];
  d.qatorlar.forEach(function(r){ aoa.push([r.sinf,r.ism,soz(r.holat),r.vaqt]); });
  return tushir(aoa,'davomat_'+d.kun,'Kun');
 }).then(function(tur){
  btn.disabled=false; btn.textContent=t;
  if(tur==='csv') alert('Excel kutubxonasi yuklanmadi \u2014 CSV fayl saqlandi. Uni Excel bemalol ochadi.');
 })["catch"](function(){ btn.disabled=false; btn.textContent=t; alert('Xatolik'); });
}
function haftaExcel(btn){
 var t=btn.textContent; btn.disabled=true; btn.textContent='\u2026';
 var kun=KUN||(D&&D.kun);
 rpc('ep_dav_export_hafta',{p_token:TOK,p_kun:kun}).then(function(d){
  if(!d||!d.ok) throw new Error('rpc');
  var bosh=['Sinf','O\u2018quvchi'];
  for(var i=0;i<7;i++){ bosh.push(KN[i]+' '+d.kunlar[i].slice(8)); }
  var aoa=[['EduNova School \u2014 haftalik davomat'],
           ['Hafta boshi', d.boshi],[],bosh];
  d.qatorlar.forEach(function(r){
   var q=[r.sinf,r.ism];
   for(var i=0;i<7;i++){ q.push(soz(r.holatlar[i]||'')==='Belgilanmagan'?'':soz(r.holatlar[i])); }
   aoa.push(q);
  });
  return tushir(aoa,'davomat_hafta_'+d.boshi,'Hafta');
 }).then(function(tur){
  btn.disabled=false; btn.textContent=t;
  if(tur==='csv') alert('Excel kutubxonasi yuklanmadi \u2014 CSV fayl saqlandi.');
 })["catch"](function(){ btn.disabled=false; btn.textContent=t; alert('Xatolik'); });
}

/* ---------- Kelmaganlar: qo'ng'iroq ro'yxati ---------- */
var KM=null;
function telHref(t){ return 'tel:'+String(t||'').replace(/[^0-9+]/g,''); }
function kelmadi(){
 $('app').innerHTML='<p class="mu">Yuklanmoqda\u2026</p>';
 rpc('ep_dav_kelmadi',{p_token:TOK,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');sinflar();return;}
  KM=d;kelmadiChiz();
 })["catch"](function(){alert('Xatolik');sinflar();});
}
function kelmadiChiz(){
 var d=KM, telsiz=0;
 d.royxat.forEach(function(o){ if(!o.tel) telsiz++; });
 var h='<div class="hdr"><b>Kelmaganlar</b><span class="cnt">'+d.royxat.length+
   ' <small>'+esc(d.kun)+'</small></span></div>';
 if(telsiz) h+='<p class="sm mu">'+telsiz+' ta o\u2018quvchining telefoni yo\u2018q</p>';
 var oxirgi='';
 d.royxat.forEach(function(o){
  if(o.sinf!==oxirgi){ h+='<div class="sinfb">'+esc(o.sinf)+'</div>'; oxirgi=o.sinf; }
  h+='<div class="qrow" id="q'+o.id+'">'+
     '<div class="qi"><div class="qn">'+esc(o.ism)+'</div>'+
     '<div class="qt">'+(o.tel?esc(o.tel):'<span class="yoq">telefon yo\u2018q</span>')+'</div>'+
     (o.izoh?'<div class="qz">'+esc(o.izoh)+'</div>':'')+'</div>'+
     (o.tel?'<a class="qcall" href="'+telHref(o.tel)+'">\u260E</a>':'')+
     '<button class="qnote" onclick="izohYoz('+o.id+')">\u270E</button>'+
     '</div>';
 });
 if(!d.royxat.length)h+='<p class="mu center">Hamma keldi \u2705</p>';
 $('app').innerHTML=h;
 $('bar').innerHTML='<div class="bar"><button class="back" onclick="sinflar()">\u2039 Sinflar</button>'+
   '<button class="all" onclick="kelmadi()">Yangilash</button>'+
   '<button class="add" onclick="kelmadiExcel(this)">\u2b07 Excel</button></div>';
 window.scrollTo(0,0);
}
function izohYoz(id){
 var o=null; KM.royxat.forEach(function(x){if(x.id===id)o=x;});
 if(!o)return;
 var v=prompt(o.ism+' \u2014 qo\u2018ng\u2018iroq natijasi:', o.izoh||'');
 if(v===null)return;
 rpc('ep_dav_izoh',{p_token:TOK,p_oquvchi_id:id,p_izoh:v,p_kun:KUN}).then(function(d){
  if(!d||!d.ok){alert('Xatolik');return;}
  o.izoh=v.trim(); kelmadiChiz();
 })["catch"](function(){alert('Xatolik');});
}
function kelmadiExcel(btn){
 var t=btn.textContent; btn.disabled=true; btn.textContent='\u2026';
 rpc('ep_dav_kelmadi',{p_token:TOK,p_kun:KUN}).then(function(d){
  if(!d||!d.ok) throw new Error('rpc');
  var aoa=[['EduNova School \u2014 kelmaganlar (obzvon)'],
           ['Sana', d.kun],['Jami', d.royxat.length],[],
           ['#','Sinf','O\u2018quvchi','Telefon','Natija','Izoh (qo\u2018lda)']];
  d.royxat.forEach(function(r,i){ aoa.push([i+1,r.sinf,r.ism,r.tel||'',r.izoh||'','']); });
  return tushir(aoa,'kelmaganlar_'+d.kun,'Obzvon');
 }).then(function(tur){
  btn.disabled=false; btn.textContent=t;
  if(tur==='csv') alert('CSV saqlandi \u2014 Excel ochadi.');
 })["catch"](function(){ btn.disabled=false; btn.textContent=t; alert('Xatolik'); });
}

</script></body></html>
