 return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',

   body:JSON.stringify(args||{})}).then(function(r){return r.json();});

var PAD,PCTX;
function padInit(){
 PAD=$('pad'); var r=PAD.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
 PAD.width=Math.round(r.width*dpr); PAD.height=Math.round(190*dpr);
 PCTX=PAD.getContext('2d'); PCTX.scale(dpr,dpr);
 PCTX.lineWidth=2.4; PCTX.lineCap='round'; PCTX.lineJoin='round'; PCTX.strokeStyle='#111';
 CHIZDI=false;
 var draw=false,lx=0,ly=0;
 function pos(ev){var b=PAD.getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;
  return {x:p.clientX-b.left,y:p.clientY-b.top};}
 function down(ev){ev.preventDefault();draw=true;var p=pos(ev);lx=p.x;ly=p.y;}
 function move(ev){if(!draw)return;ev.preventDefault();var p=pos(ev);
  PCTX.beginPath();PCTX.moveTo(lx,ly);PCTX.lineTo(p.x,p.y);PCTX.stroke();lx=p.x;ly=p.y;CHIZDI=true;}
 function up(){draw=false;}
 PAD.addEventListener('touchstart',down,{passive:false});PAD.addEventListener('touchmove',move,{passive:false});
 PAD.addEventListener('touchend',up);PAD.addEventListener('mousedown',down);
 PAD.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
}
function padTozala(){if(PCTX&&PAD){PCTX.clearRect(0,0,PAD.width,PAD.height);CHIZDI=false;}}
function yakunla(){
 var e=$('e');
 if(!$('ok1').checked){e.textContent=t('e_chk');return;}
 if(!CHIZDI){e.textContent=t('e_imzo');return;}
 e.textContent=''; var b=$('go'); b.disabled=true; b.textContent=t('yuk');
 IMZO=PAD.toDataURL('image/png');
 rpc('ep_sh_saqla',{p_kalit:KALIT,p_oquvchi_id:ST.oquvchi,p_ota_ism:ST.f_fio,p_pasport:ST.f_pas,
   p_manzil:ST.f_man,p_telefon:ST.f_tel,p_tugyil:ST.f_tugyil,
   p_narx:parseInt(String(ST.f_narx).replace(/[^0-9]/g,''),10)||null,
   p_tolov_kuni:parseInt(ST.f_tkun,10)||5,p_oquv_yili:parseInt(ST.f_yil,10)||null,
   p_til:(ST.f_til==='rus'?'ru':'uz'),p_imzo:IMZO,p_matn:shMatn(),
   p_qurilma:navigator.userAgent}).then(function(d){
  b.disabled=false;b.textContent=t('imzola');
  if(!d||!d.ok){e.textContent=t('xato')+(d&&d.xato?(' ['+d.xato+']'):'');return;}
  try{localStorage.removeItem('sh_qoralama');}catch(x){}
  ekran5(d);
 })["catch"](function(){b.disabled=false;b.textContent=t('imzola');e.textContent=t('xato');});
}
